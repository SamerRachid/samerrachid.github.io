name: Rebuild listing pages

# Runs automatically every 4 hours, and any time you push to main.
# You can also trigger it by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "0 */4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm install needed: the generator talks to Supabase over
      # plain HTTP using Node's built-in fetch, rather than loading the
      # @supabase/supabase-js SDK — which tries to open a realtime
      # WebSocket connection on startup and crashes in plain Node.js.
      - name: Generate listing pages + sitemap
        run: node scripts/generate-listings.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "balkoun-bot"
          git config user.email "actions@github.com"
          git add listing sitemap.xml
          git diff --cached --quiet || git commit -m "Rebuild listing pages [auto]"
          git push
