name: Rebuild static pages

# Runs every 4 hours, on every push to main, and by hand from the Actions tab.
# Generates the crawlable pages (listings, governorates, areas) from Supabase
# and commits them, so Google always sees real HTML with real addresses.
on:
  schedule:
    - cron: "0 */4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate listing pages
        run: node scripts/generate-listings.mjs

      - name: Generate governorate and area pages + sitemap
        run: node scripts/generate-pages.mjs

      - name: App fallback for deep links (/post, /listing/123 …)
        run: cp index.html 404.html

      - name: Real 200 pages for the app routes (/search, /wanted, /agencies, /projects, /mapsearch)
        run: node scripts/generate-routes.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "balkoun-bot"
          git config user.email "actions@github.com"
          git add listing for-sale for-rent areas about contactus guides en de search mapsearch wanted agencies projects sitemap.xml 404.html
          # other countries live under two-letter folders (/lb/, /jo/ …); -A also stages a tree removed when a country is switched off
          git add -A -- ':(glob)[a-z][a-z]/**' || true
          git diff --cached --quiet || git commit -m "Rebuild static pages [auto]"
          git pull --rebase origin main || true
          git push
