<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy-d);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#fff}
.stage{position:relative;height:100vh;min-height:620px;overflow:hidden;background:radial-gradient(120% 80% at 50% 115%,#1C2D56 0%,#0B1224 62%)}
.photo{position:absolute;inset:0;background:url(/assets/hero-default.jpg) center/cover no-repeat;opacity:0;transform:scale(1.06);filter:brightness(.35) saturate(.9);will-change:opacity,transform,filter}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,14,26,.62),rgba(9,14,26,.18) 42%,rgba(9,14,26,.55) 100%);opacity:0}
.art{position:absolute;inset:0;will-change:opacity,transform}
.art svg{width:100%;height:100%;display:block}
.glow{filter:drop-shadow(0 0 6px rgba(227,181,99,.55))}

.logo{font:700 30px/1 'El Messiri';color:var(--gold-l);letter-spacing:.01em}
nav{display:flex;gap:22px;font-size:14.5px}
.tools{margin-inline-start:auto;display:flex;gap:10px;align-items:center}
.btn{border:1px solid rgba(255,255,255,.35);border-radius:7px;padding:8px 14px;font-size:13.5px;color:#fff;background:transparent}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1A1206;font-weight:700}
.copy{position:absolute;inset-inline:0;bottom:16vh;z-index:5;padding:0 40px;max-width:1180px;margin:0 auto;width:100%}
h1{font:600 clamp(40px,5.4vw,70px)/1.18 'El Messiri';margin:0 0 26px;text-shadow:0 2px 26px rgba(0,0,0,.4)}
h1 .w{display:inline-block;opacity:0;transform:translateY(26px)}

.sbar{display:flex;align-items:stretch;background:#fff;border-radius:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.65);opacity:0;transform:translateY(28px);color:var(--navy);max-width:1060px;overflow:hidden}

.seg span{padding:7px 14px;border-radius:999px;font-size:13.5px;color:#4B5563}
.seg span.on{background:var(--navy);color:#fff;font-weight:600}
.f{flex:1;padding:10px 16px;border-inline-end:1px solid var(--line);min-width:0}
.f small{display:block;font-size:11px;color:#9CA3AF;font-weight:600;margin-bottom:2px}
.f div{font-size:14px;color:#9CA3AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{background:var(--gold);color:#1A1206;font-weight:700;display:grid;place-items:center;padding:0 30px;font-size:15px;line-height:1.4;text-align:center}
.go small{font-weight:400;font-size:11.5px;opacity:.75}
.mapb{width:48px;display:grid;place-items:center;background:var(--cream);color:var(--navy)}
/* chooser */

.dock button{border:0;background:transparent;color:rgba(255,255,255,.85);font:inherit;font-size:13.5px;padding:9px 16px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.dock button b{font:600 13px 'El Messiri';color:var(--gold-l)}
.dock button.on{background:var(--gold);color:#1A1206}.dock button.on b{color:#1A1206}
.dock .rep{width:38px;height:38px;padding:0;justify-content:center;border-inline-start:1px solid rgba(255,255,255,.14);border-radius:0 999px 999px 0;margin-inline-start:2px}

@media(prefers-reduced-motion:reduce){.photo{opacity:1!important;transform:none!important;filter:none!important}.scrim{opacity:1!important}.art{display:none}h1 .w,.sbar{opacity:1!important;transform:none!important}}

/* ── 1 · Balcony dawn: gold line drawing of Damascus (Qasioun, Umayyad Mosque, Damascene houses with balconies) ── */
function v1(){
  desc.textContent="خطوط ذهبية ترسم دمشق: قاسيون، الجامع الأموي، وبيوت دمشقية بشرفاتها — ثم يطلع الفجر على الصورة الحقيقية.";

/* ── 2 · Syria lights up: the country outline draws, cities light one by one, the map recedes into a watermark ── */
function v2(){
  desc.textContent="خريطة سوريا ترسم نفسها، المدن تضيء واحدة بعد الأخرى، ثم تتراجع الخريطة كعلامة خافتة خلف العنوان.";

/* ── 3 · Damascene pattern: the eight-point star lattice of Damascene doors assembles in gold, then dissolves into the photo ── */
function v3(){
  desc.textContent="نقش النجمة الثمانية من الأبواب والأسقف الدمشقية يتشكّل بالذهب من المركز إلى الأطراف، ثم يذوب في الصورة.";
  var W=1600,H=900,S=150,R=60,h=R/Math.SQRT2;

    var c2=svg("path",{d:"M"+x+" "+(y+R)+" V"+(y+S-R)},g); draw(c2,t+350,400); c2.setAttribute("stroke-opacity",".8");
    // small rotated square in the cell centre where four crosses meet
    var m=svg("path",{d:sq(x+S/2,y+S/2,14,45),fill:GOLD,"fill-opacity":"0"},g); draw(m,t+600,350); A(m,[{fillOpacity:0},{fillOpacity:.5}],{delay:t+800,duration:400});
  }
  var sheen=svg("rect",{x:-W,y:0,width:W,height:H,fill:"url(#sheen)"},s);
  A(sheen,[{transform:"translateX(0)"},{transform:"translateX("+(2*W)+"px)"}],{delay:1900,duration:1400,easing:"cubic-bezier(.4,0,.2,1)"});
  A(art,[{opacity:1,transform:"scale(1)",filter:"blur(0)"},{opacity:1,transform:"scale(1)",filter:"blur(0)",offset:.3},{opacity:0,transform:"scale(1.05)",filter:"blur(3px)"}],{delay:2500,duration:1500,easing:"ease-in-out"});
  finish(2700,3100);
}

var V={1:v1,2:v2,3:v3}, cur=null;
function play(n){
  cur=n; location.hash=n; anims.forEach(function(a){ a.cancel() }); anims=[]; art.innerHTML=""; art.style.cssText="";
  [].slice.call(document.querySelectorAll(".dock [data-v]")).forEach(function(b){ b.classList.toggle("on",b.dataset.v==String(n)) });
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ return }
  photo.style.opacity=0; scrim.style.opacity=0; words.forEach(function(w){w.style.opacity=0}); sbar.style.opacity=0;
  V[n]();
}
document.getElementById("dock").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; if(b.id==="rep") play(cur); else play(parseInt(b.dataset.v,10)) });
document.addEventListener("keydown",function(e){ if(e.key>="1"&&e.key<="3") play(parseInt(e.key,10)); if(e.key===" "){ e.preventDefault(); play(cur) } });
var start=parseInt((location.hash||"").replace("#",""),10); play(V[start]?start:1);
})();
</script>
