async function adminLoad(){
  ADM._reviewsLoaded=false; ADM._statsLoaded=false; ADM._settingsLoaded=false; ADM._alertsLoaded=false; ADM._adSlotsLoaded=false; ADM._featuredListLoaded=false;
  ADM._storageUsageLoaded=false;
  ADM.dangerUnlocked=false;
  ADM.restoreUnlocked=false; ADM.restoreFileInfo=""; ADM.restoreData=null;
  try{
    ADM.data = await rpc("bk_admin_data",{p_token:ADM.token}); ADM.msg="";
    var me = ADM.data && ADM.data.me;
    if(me){
      ADM.meId=me.id; ADM.meName=((me.name||"")+" "+(me.family_name||"")).trim();
      ADM.perms=me.permissions||[]; ADM.isSuper=!!me.is_super_admin;
    }
    var tabPermMap={mainpage:"homepage"}; // the one tab whose name doesn't match its permission key
    if(!can(tabPermMap[ADM.tab]||ADM.tab)){
      var order=["dashboard","listings","featured","homepage","ads","users","reports","feedback","reviews","msgs","stats","settings"];
      var first=order.filter(function(k){return can(tabPermMap[k]||k)})[0];
      ADM.tab = (first==="homepage"?"mainpage":first) || (ADM.isSuper?"admins":"listings");
    }
    if(can("msgs")){
      rpc("bk_admin_notifications",{p_token:ADM.token}).then(function(r){
        if(r){ ADM.alerts=r.items||[]; ADM.alertsUnread=r.unread||0; ADM._alertsLoaded=true; render() }
      }).catch(function(){});
      startAdminAlertsPolling();
    }
  }
  catch(e){ ADM.token=null; ADM.msg=e.message||"error"; try{localStorage.removeItem("balkoun_adm")}catch(x){} }
  render();
}
function wireAdmin(){
  var doAdminLogin=async function(){
    var btn=$("#adGo"); if(!btn) return;
    var ph="+"+$("#adCC").value+($("#adPhone").value||"").replace(/\D/g,"");
    var pw=$("#adPass").value||"";
    btn.disabled=true; btn.textContent=t("saving");
    try{
      var r=await rpc("bk_admin_login",{p_phone:ph,p_hash:await sha(pw)});
      ADM.token=r.token; try{localStorage.setItem("balkoun_adm",r.token)}catch(x){}
      await adminLoad();
    }catch(e){ btn.disabled=false; btn.textContent=t("login");
      ADM.msg = e.message==="notadmin"?t("notAdmin"):e.message==="badpass"?t("wrongPass"):e.message;
      render() }
  };
  if($("#adGo")) $("#adGo").onclick=doAdminLogin;
  if($("#adPass")) $("#adPass").addEventListener("keydown",function(e){
    if(e.key==="Enter"){ e.preventDefault(); doAdminLogin() }
  });
  if($("#adOut")) $("#adOut").onclick=async function(){
    try{ await rpc("bk_admin_logout",{p_token:ADM.token}) }catch(e){}
    stopAdminAlertsPolling();
    ADM.token=null; ADM.data=null; ADM.editId=null; ADM.editRow=null;
    try{localStorage.removeItem("balkoun_adm")}catch(x){}
    VIEW="home"; render();
  };
  if($("#adViewSite")) $("#adViewSite").onclick=async function(){
    // logs the admin into their own account (every admin is also a
    // real row in the users table) rather than just showing an
    // anonymous, logged-out homepage — that only happened to look
    // like "viewing as a user" if the admin separately already had
    // their own regular session open, which usually isn't the case
    this.disabled = true;
    try{
      if(!USER){
        var u = await rpc("bk_admin_switch_to_user",{p_token:ADM.token});
        if(u && !u.error){ USER=u; saveSession(USER); loadSaved(); loadNotifications(); startNotifPolling(); }
      }
      VIEW="home"; scrollTo(0,0); render();
    }catch(e){ VIEW="home"; scrollTo(0,0); render(); }
  };
  if($("#adRefresh")) $("#adRefresh").onclick=function(){ adminLoad() };
  if($("#adBack")) $("#adBack").onclick=function(){ ADM.editId=null; ADM.editRow=null; render() };
  $$("[data-atab]").forEach(function(e){ e.onclick=function(){
    ADM.tab=e.dataset.atab;
    window._admMobileDetail=false;
    var sb=$("#aSidebar"); if(sb) sb.classList.remove("on"); // auto-close on mobile after picking a section
    render();
    try{ window.scrollTo({top:0,behavior:"instant"}) }catch(e2){ try{ window.scrollTo(0,0) }catch(e3){} }
  } });
  if($("#aSidebarToggle")) $("#aSidebarToggle").onclick=function(){
    var sb=$("#aSidebar"); if(sb) sb.classList.toggle("on");
  };

  var act=async function(fn,args){
    try{ await rpc(fn,args); await adminLoad() }
    catch(e){ alert(e.message||"error") } };

  $$("[data-alive]").forEach(function(e){ e.onclick=function(){
    act("bk_admin_set_status",{p_token:ADM.token,p_listing:+e.dataset.alive,p_status:"live"}) }});
  $$("[data-apend]").forEach(function(e){ e.onclick=function(){
    act("bk_admin_set_status",{p_token:ADM.token,p_listing:+e.dataset.apend,p_status:"pending"}) }});
  $$("[data-adel]").forEach(function(e){ e.onclick=async function(){
    if(!confirm(t("confirmDel"))) return;
    var id=e.dataset.adel;
    await clearStorageFolder("photos/listings/"+id);
    act("bk_admin_delete_listing",{p_token:ADM.token,p_listing:+id});
  }});
  $$("[data-ablock]").forEach(function(e){ e.onclick=function(){
    act("bk_admin_block_user",{p_token:ADM.token,p_user:e.dataset.ablock,p_blocked:e.dataset.on==="1"}) }});

  $$(".lvlpick").forEach(function(sel){ if(!sel.dataset.uid) return; sel.onchange=function(){
    act("bk_admin_set_level",{p_token:ADM.token,p_user:this.dataset.uid,p_level:this.value}) }});
  if($("#uSortPick")) $("#uSortPick").onchange=function(){ ADM.userSort=this.value; render() };
  if($("#uLevelPick")) $("#uLevelPick").onchange=function(){ ADM.userLevelFilter=this.value; render() };
  if($("#uBlockPick")) $("#uBlockPick").onchange=function(){ ADM.userBlockedFilter=this.value; render() };

  $$("[data-arate]").forEach(function(e){ e.onclick=function(){
    ADM.rateTarget=e.dataset.arate; ADM.rateStars=0; ADM.rateMsg=""; ADM.pwTarget=null; render() }});
  $$("[data-apw]").forEach(function(e){ e.onclick=function(){
    ADM.pwTarget=e.dataset.apw; ADM.pwMsg=""; ADM.rateTarget=null; render() }});
  if($("#aRevCancel")) $("#aRevCancel").onclick=function(){ ADM.rateTarget=null; render() };
  if($("#aPwCancel")) $("#aPwCancel").onclick=function(){ ADM.pwTarget=null; render() };
  $$("[data-astar]").forEach(function(s){ s.onclick=function(){ ADM.rateStars=+this.dataset.astar; render() } });
  if($("#aRevSave")) $("#aRevSave").onclick=async function(){
    if(!ADM.rateStars){ ADM.rateMsg=t("pickStars"); render(); return }
    try{
      await rpc("bk_admin_review_set",{p_token:ADM.token,p_target:ADM.rateTarget,
        p_stars:ADM.rateStars,p_body:($("#aRevBody")||{}).value||""});
      ADM.rateTarget=null; await adminLoad();
    }catch(e){ ADM.rateMsg=e.message||"error"; render() }
  };
  if($("#aPwSave")) $("#aPwSave").onclick=async function(){
    var pw=($("#aNewPass")||{}).value||"";
    if(pw.length<6){ ADM.pwMsg=t("shortPass"); render(); return }
    try{
      await rpc("bk_admin_reset_password",{p_token:ADM.token,p_user:ADM.pwTarget,p_new_pass:pw});
      ADM.pwMsg=t("savedOk"); ADM.pwTarget=null; render();
    }catch(e){ ADM.pwMsg=e.message||"error"; render() }
  };

  // open the full listing editor
  $$("[data-adopen]").forEach(function(e){ e.onclick=async function(){
    // full parity with a member's own "Edit listing" page — location,
    // every detail field, all of it — rather than the old handful-
    // of-fields inline form. bk_admin_listing already returns every
    // raw column (select ll.*), and fromRow() is the exact same
    // normalizer the rest of the site uses to turn that raw row into
    // the shape editView() expects, so this is genuinely the same
    // form a member sees, just reached from the admin side
    var id=+e.dataset.adopen;
    EDIT={id:id, row:null, msg:"", photos:[], lat:null, lng:null, locTouched:false, isAdmin:true};
    VIEW="edit"; scrollTo(0,0); render();
    try{
      var r=await rpc("bk_admin_listing",{p_token:ADM.token,p_id:id});
      if(r&&r.error) throw new Error(r.error);
      var row=fromRow(r);
      EDIT.row=row; EDIT.lat=row.lat||null; EDIT.lng=row.lng||null;
      render();
    }catch(err){ alert(err.message||"error"); VIEW="admin"; render() }
  }});

  if($("#aeSave")) $("#aeSave").onclick=async function(){
    var v=function(id){var el=$("#"+id); return el?el.value:""};
    var patch={
      price_usd:+v("aePrice")||undefined, area_m2:+v("aeArea")||undefined,
      rooms:v("aeRooms")===""?null:+v("aeRooms"),
      baths:v("aeBaths")===""?null:+v("aeBaths"),
      floor:v("aeFloor")===""?null:+v("aeFloor"),
      description:v("aeDesc")||undefined
    };
    if($("#aeLiving")) patch.living_rooms = v("aeLiving")===""?null:+v("aeLiving");
    if($('input[name=aetb]:checked')) patch.tabu=$('input[name=aetb]:checked').value;
    if($('input[name=aecd]:checked')) patch.condition=$('input[name=aecd]:checked').value;
    this.disabled=true; this.textContent=t("saving");
    try{
      await rpc("bk_admin_edit_listing",{p_token:ADM.token,p_id:ADM.editId,p_patch:patch});
      await adminLoad();
      ADM.editId=null; ADM.editRow=null; render();
    }catch(e){ if($("#aeMsg")) $("#aeMsg").textContent=e.message||"error";
      this.disabled=false; this.textContent=t("saveChanges") }
  };
  if($("#aeDelete")) $("#aeDelete").onclick=async function(){
    if(!confirm(t("confirmDel"))) return;
    try{
      await rpc("bk_admin_delete_listing",{p_token:ADM.token,p_listing:ADM.editId});
      await adminLoad(); ADM.editId=null; ADM.editRow=null; render();
    }catch(e){ alert(e.message||"error") }
  };

  // reply to a report or piece of feedback
  $$("[data-replysend]").forEach(function(btn){ btn.onclick=async function(){
    var key=btn.dataset.replysend, kind=key.split(":")[0], id=+key.split(":")[1];
    var box=$('[data-replybox="'+key+'"]');
    var txt=box?box.value.trim():"";
    if(!txt){ if(box) box.focus(); return }
    btn.disabled=true; btn.textContent=t("saving");
    try{ await rpc("bk_admin_reply",{p_token:ADM.token,p_kind:kind,p_id:id,p_reply:txt}); await adminLoad() }
    catch(e){ alert(e.message||"error"); btn.disabled=false; btn.textContent=t("sendReply") } }});
  $$("[data-msgfilter]").forEach(function(e){ e.onclick=function(){
    ADM.msgFilter=this.dataset.msgfilter; render() }});
  $$("[data-tosolved]").forEach(function(e){ e.onclick=async function(){
    var key=this.dataset.tosolved, kind=key.split(":")[0], id=+key.split(":")[1], val=this.dataset.val==="1";
    try{ await rpc("bk_admin_set_solved",{p_token:ADM.token,p_kind:kind,p_id:id,p_solved:val}); await adminLoad() }
    catch(e){ alert(e.message||"error") }
  }});
  $$("[data-setprio]").forEach(function(e){ e.onclick=async function(){
    var key=this.dataset.setprio, kind=key.split(":")[0], id=+key.split(":")[1], val=this.dataset.prioval;
    try{ await rpc("bk_admin_set_priority",{p_token:ADM.token,p_kind:kind,p_id:id,p_priority:val}); await adminLoad() }
    catch(e){ alert(e.message||"error") }
  }});

  // reviews moderation
  $$("[data-delreview]").forEach(function(e){ e.onclick=function(){
    if(confirm(t("confirmDelReview"))) act("bk_admin_delete_review",{p_token:ADM.token,p_id:+e.dataset.delreview}) }});
  if(ADM.tab==="reviews" && !ADM._reviewsLoaded){
    ADM._reviewsLoaded=true;
    rpc("bk_admin_reviews",{p_token:ADM.token}).then(function(r){
      if(ADM.data){ ADM.data.reviews=r||[]; render() } }).catch(function(){});
  }
  if((ADM.tab==="stats"||ADM.tab==="dashboard") && !ADM._statsLoaded){
    ADM._statsLoaded=true;
    rpc("bk_admin_stats",{p_token:ADM.token}).then(function(r){
      ADM.stats=r||null; ADM.statsErr=""; render()
    }).catch(function(e){
      ADM.stats=null; ADM.statsErr=(e&&e.message)||"error"; render()
    });
  }
  if((ADM.tab==="dashboard"||ADM.tab==="stats") && !ADM._storageUsageLoaded){
    ADM._storageUsageLoaded=true;
    rpc("bk_admin_storage_usage",{p_token:ADM.token}).then(function(r){
      ADM.storageUsage=r||null; render()
    }).catch(function(){});
  }
  if(ADM.tab==="msgs" && ADM.alertsUnread){
    ADM.alertsUnread=0; ADM.alerts.forEach(function(n){n.is_read=true});
    rpc("bk_admin_mark_notifications_read",{p_token:ADM.token}).catch(function(){});
  }
  // also needed for the Media Library's own "ads" category, not just
  // the dedicated Ad Squares tab — without this, navigating straight
  // to Photos > Ads never loads the slot data the "in use" check
  // depends on, so every file looks unused regardless of whether it
  // actually is (the exact bug reported: everything shown as unused)
  if((ADM.tab==="ads" || (ADM.tab==="photos" && ADM.mediaCategory==="ads")) && !ADM._adSlotsLoaded){
    ADM._adSlotsLoaded=true;
    rpc("bk_admin_list_ads",{p_token:ADM.token}).then(function(r){
      ADM.adSlots=r||[]; render()
    }).catch(function(){});

  if(ADM.tab==="photos" && !ADM._photosLoaded){
    ADM._photosLoaded=true;
    ADM._photosLoading=true;
    DB.from("listing_photos").select("id,listing_id,url,thumb_url,sort_order,created_at")
      .order("listing_id",{ascending:false}).order("sort_order",{ascending:true}).limit(300)
      .then(function(r){
        ADM._photosLoading=false;
        ADM.photosList = (r&&r.data)||[];
        render();
      }).catch(function(){ ADM._photosLoading=false; render() });
  }
  // the three non-listing media categories (ads/banners/background)
  // each get their own storage folder pair (photos/<cat> and
  // videos/<cat>) — fetched together and cached per category the
  // first time that tab is opened, so switching between them doesn't
  // re-fetch every time
  if(ADM.tab==="photos" && ADM.mediaCategory && ADM.mediaCategory!=="listings" && DB
     && !(ADM._mediaLoadedCats||{})[ADM.mediaCategory]){
    var cat = ADM.mediaCategory;
    // the OLD flat folder each category used before this reorganization
    // (banners' old folder was singular: "banner", not "banners") —
    // anything uploaded before this change is still sitting there, so
    // it has to be included too or it would look like it vanished
    var oldFolder = {ads:"ads", banners:"banner", background:"hero"}[cat];
    ADM._mediaLoadedCats = ADM._mediaLoadedCats||{};
    ADM._mediaLoadedCats[cat] = true;
    ADM._mediaLoading = cat;
    var isVideoName = function(name){ return /\.(mp4|webm|mov|m4v)$/i.test(name) };
    Promise.all([
      DB.storage.from("photos").list("photos/"+cat,{limit:200,sortBy:{column:"created_at",order:"desc"}}),
      DB.storage.from("photos").list("videos/"+cat,{limit:200,sortBy:{column:"created_at",order:"desc"}}),
      DB.storage.from("photos").list(oldFolder,{limit:200,sortBy:{column:"created_at",order:"desc"}})
    ]).then(function(results){
      if(ADM._mediaLoading===cat) ADM._mediaLoading=null;
      var combined = [];
      (results[0]&&results[0].data||[]).forEach(function(f){

  // file upload: read the file, shrink images (reusing the same helper
  // listing photos use), upload to Supabase Storage, and populate the
  // hidden fields the save handler reads from
  var wireAdFileInput=function(suffix){
    var pfx="ad"+suffix, input=$("#"+pfx+"File");
    if(!input) return;
    input.onchange=async function(){
      var files=this.files ? Array.prototype.slice.call(this.files) : [];
      if(!files.length) return;
      var msgEl=$("#"+pfx+"FileMsg");
      var imgUrlEl=$("#"+pfx+"ImgUrl"), imgUrlsEl=$("#"+pfx+"ImgUrls"), typeEl=$("#"+pfx+"MediaType");
      var uploadedUrls=[]; var anyVideo=false;
      try{
        if(!DB) throw new Error("no client");
        if(files.length>1 && files.some(function(f){return /^video\//.test(f.type)})){
          throw new Error(t("adNoMultiVideo"));
        }
        for(var i=0;i<files.length;i++){
          var f=files[i];
          var isVideo=/^video\//.test(f.type);
          if(isVideo) anyVideo=true;
          if(msgEl) msgEl.textContent=t("uploading")+" "+(i+1)+"/"+files.length;
          var path=(isVideo?"videos/ads/":"photos/ads/")+Date.now()+"_"+i+"_"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
          var uploadFile=f;
          var uploadContentType=f.type;
          if(!isVideo){
            var raw=await new Promise(function(res,rej){
              var r=new FileReader(); r.onload=function(){res(r.result)};
              r.onerror=function(){rej(new Error("read"))}; r.readAsDataURL(f);
            });
            uploadFile = await shrink(raw, 1000, 0.82);
            uploadContentType = "image/jpeg"; // shrink() always re-encodes to JPEG,
            // regardless of the original file's format — the uploaded
            // bytes and the declared content-type must match
          }
          var up=await storageUpload(path, uploadFile,
            {contentType:uploadContentType, upsert:false});
          if(up.error) throw up.error;
          uploadedUrls.push(DB.storage.from("photos").getPublicUrl(path).data.publicUrl);
        }
        var isSingleVideo = anyVideo && uploadedUrls.length===1;
        // whatever this ad square was using before is tracked here,
        // not deleted yet — actual deletion waits for "Save" so an
        // upload that's never saved never breaks the live ad square
        var oldUrls = [];
        if(imgUrlEl && imgUrlEl.value) oldUrls.push(imgUrlEl.value);
        if(imgUrlsEl && imgUrlsEl.value){
          try{
            var oldArr = JSON.parse(imgUrlsEl.value);
            if(Array.isArray(oldArr)) oldUrls = oldUrls.concat(oldArr);
          }catch(e){}
        }
        if(oldUrls.length) (ADM_adPendingDeletes[suffix]=ADM_adPendingDeletes[suffix]||[]).push.apply(ADM_adPendingDeletes[suffix], oldUrls);
        if(imgUrlEl) imgUrlEl.value=uploadedUrls[0]||"";
        // image_urls is specifically the multi-image rotation list — a
        // video must never end up in it, or the homepage's own render
        // logic (which checks image_urls before media_type) will treat
        // the video as a photo and silently fail to display it at all
        if(imgUrlsEl) imgUrlsEl.value=isSingleVideo ? "[]" : JSON.stringify(uploadedUrls);
        if(typeEl) typeEl.value=isSingleVideo?"video":"image";
        if(msgEl) msgEl.textContent=t("savedOk")+" ("+uploadedUrls.length+")";
      }catch(e){ if(msgEl) msgEl.textContent=e.message||"error" }
    };
  };

  var saveAdSlot=async function(suffix){
    var pfx="ad"+suffix;
    var isNew = suffix==="New";
    var en=($("#"+pfx+"En")||{}).value!=="0";
    var label=($("#"+pfx+"Label")||{}).value||"";
    var mode=($('input[name="'+pfx+'Mode"]:checked')||{}).value||"upload";
    var btn=$('[data-saveadslot="'+suffix+'"]'); if(btn) btn.disabled=true;
    var msgEl=$("#"+pfx+"Msg");
    try{
      var payload={p_token:ADM.token, p_id:isNew?null:suffix, p_position:null, p_enabled:en, p_label:label,
        p_image_url:null, p_link_url:null, p_media_type:"image", p_linked_listing_id:null,
        p_image_urls:[], p_video_embed_url:null,
        p_sponsor_name:($("#"+pfx+"Sponsor")||{}).value||null,
        p_overlay_top:($("#"+pfx+"TopText")||{}).value||null,
        p_overlay_bottom:($("#"+pfx+"BottomText")||{}).value||null,
        p_starts_at:($("#"+pfx+"Starts")||{}).value?new Date(($("#"+pfx+"Starts")||{}).value+"T00:00:00").toISOString():null,
        p_expires_at:($("#"+pfx+"Expires")||{}).value?new Date(($("#"+pfx+"Expires")||{}).value+"T23:59:59").toISOString():null};
      if(mode==="linked"){
        var listingId=($("#"+pfx+"Listing")||{}).value;
        if(!listingId) throw new Error(t("adPickListingL"));
        payload.p_linked_listing_id=+listingId;
      } else if(mode==="video_embed"){
        var vUrl=($("#"+pfx+"VideoUrl")||{}).value||"";
        if(!vUrl || !videoEmbedInfo(vUrl)) throw new Error(t("adInvalidVideoUrl"));
        payload.p_video_embed_url=vUrl;
        payload.p_link_url=($("#"+pfx+"VideoLink")||{}).value||null;
      } else {
        var urlsRaw=($("#"+pfx+"ImgUrls")||{}).value||"";
        var urls=[]; try{ urls=urlsRaw?JSON.parse(urlsRaw):[] }catch(e){}
        payload.p_image_url=($("#"+pfx+"ImgUrl")||{}).value||null;
        payload.p_image_urls=urls;
        payload.p_link_url=($("#"+pfx+"Link")||{}).value||null;
        payload.p_media_type=($("#"+pfx+"MediaType")||{}).value||"image";
      }
      await rpc("bk_admin_save_ad",payload);
      // the save just succeeded, so any files this ad square was
      // replaced away from during editing are now genuinely orphaned
      // — safe to clean up only now, not any earlier
      (ADM_adPendingDeletes[suffix]||[]).forEach(function(url){ replaceStorageFile(url) });
      ADM_adPendingDeletes[suffix] = [];
      ADM.newAdOpen=false; ADM.editAdId=null; await reloadAdSlots(); render();
    }catch(e){ if(msgEl) msgEl.textContent=e.message||"error"; if(btn) btn.disabled=false }
  };

        if((r && r.error) || !(r && r.data && r.data.length)) throw new Error();

/* ── image compression ──────────────────────────────────────────────
   Resizing happens on the user's phone before upload. A raw photo is
   3–5 MB; this makes it ~120 KB full and ~20 KB thumbnail. That is the
   difference between ~1,000 listings on the free tier and ~20,000.   */
// deletes every file inside a storage folder (used for cleaning up a
// listing's photos, or the whole shared ad-squares folder) — lists
// the folder first since Supabase Storage has no "delete by prefix"
// shortcut, then removes every file found in one batched call
// extracts the storage path from a public URL Supabase itself
// generated (…/storage/v1/object/public/photos/<path>) — used to
// delete a file that's about to be replaced, since uploading a new
// one never overwrites the old file's own path (each upload gets a
// fresh, uniquely-timestamped name), so without this the previous
// file would simply sit there taking up space forever
function storagePathFromUrl(url){
  if(!url) return null;
  var marker = "/public/photos/";
  var idx = url.indexOf(marker);
  if(idx===-1) return null;
  return decodeURIComponent(url.slice(idx+marker.length));
}
async function replaceStorageFile(oldUrl){
  // returns true only on a CONFIRMED successful delete — Supabase
  // resolves this call normally even when the delete failed
  // server-side (wrong path, permissions, file already gone, or a
  // storage RLS policy silently blocking it — which shows up as a
  // clean, error-free response with an EMPTY data array, not an
  // error). Every caller that only wants best-effort cleanup
  // (replacing a banner/background/ad photo, where a stray leftover
  // file is a minor problem next to failing the whole save) can keep
  // ignoring the return value exactly as before. A caller that's the
  // entire point of the action — the user explicitly clicked "delete
  // this file to free space" — has to check it, or a failed delete
  // looks successful in the UI while nothing was actually freed
  if(!DB || !DB.storage || !oldUrl) return false;
  var path = storagePathFromUrl(oldUrl);
  if(!path) return false;
  try{
    var r = await storageRemove([path]);
    return !(r && r.error) && !!(r && r.data && r.data.length);
  }catch(e){ return false }
}
async function clearStorageFolder(folder){
  if(!DB || !DB.storage) return;
  try{
    var listed = await DB.storage.from("photos").list(folder);
    if(listed.error || !listed.data || !listed.data.length) return;
    var paths = listed.data.map(function(f){ return folder+"/"+f.name });
    await storageRemove(paths);
  }catch(e){}
}
function readFile(f){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(){ resolve(r.result) };
    r.onerror=function(){ reject(new Error("read")) };
    r.readAsDataURL(f);
  });
}

function shrink(src, maxW, quality){
  return new Promise(function(resolve, reject){
    var img=new Image();
    img.onload=function(){
      var sc=Math.min(1, maxW/img.width);
      var c=document.createElement("canvas");
      c.width =Math.max(1, Math.round(img.width *sc));
      c.height=Math.max(1, Math.round(img.height*sc));
      var ctx=c.getContext("2d");
      ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){ b?resolve(b):reject(new Error("encode")) }, "image/jpeg", quality);
    };
    img.onerror=function(){ reject(new Error("decode")) };
    img.src=src;
  });
}
function blobUrl(b){ return URL.createObjectURL(b) }

async function addFiles(list){
  var files=[].slice.call(list).filter(function(f){ return /^image\//.test(f.type) });
  if(!files.length) return;
  if($("#msg")) $("#msg").textContent = t("reading")+" 0/"+files.length;
  for(var i=0;i<files.length;i++){
    try{
      var raw = await new Promise(function(res,rej){
        var r=new FileReader(); r.onload=function(){res(r.result)};
        r.onerror=function(){rej(new Error("read"))}; r.readAsDataURL(files[i]);
      });

var _heroVideoEl = null; // persists across renders — see video() below
function heroVideoSpeed(){
  // playbackRate changes only how fast the SAME encoded frames are
  // shown — never re-encodes anything — so quality is identical at
  // every speed in this range; clamped defensively in case a stray
  // value ever made it into SITE from somewhere unexpected
  var pct = SITE.hero_bg_video_speed!=null ? SITE.hero_bg_video_speed : 100;
  pct = Math.max(10, Math.min(300, pct));
  return pct/100;
}
function video(){
 var c=navigator.connection||{},box=$("#hv"); if(!box)return;
 var bgType = SITE.hero_bg_type || "sketch";
 // a static photo (or an intentionally empty background) has no
 // "canplay" event to wait for — without this, the box would stay
 // stuck at opacity:0 forever, since nothing else would ever add
 // the fade-in class for these two cases
 if(bgType==="dawn"){ dawnMount(); box.classList.add("on"); return }
 if(bgType==="sketch"){ sketchMount(); box.classList.add("on"); return }
 if(bgType!=="video"){ box.classList.add("on"); return }
 // wire() (and this function with it) runs on every render() — and
 // this app renders more than once at boot: an immediate first pass,
 // then again once real data arrives, sometimes a third time while a
 // saved session gets verified. Each pass replaces the whole page's
 // HTML, including the hero box, so creating a brand-new <video src=
 // ...> element every time meant the background visibly restarted
 // from frame zero on every one of those extra renders — exactly
 // what looked like the background "loading twice". The fix: keep
 // ONE video element alive in a module-level variable and simply
 // move that same node into the fresh box each time (appendChild
 // relocates an existing node without restarting it) instead of
 // creating a new one after the first successful start.
 if(_heroVideoEl){
   _heroVideoEl.playbackRate = heroVideoSpeed();
   box.appendChild(_heroVideoEl); box.classList.add("on"); return
 }
 if(/2g|slow-2g|3g/.test(c.effectiveType||"")||c.saveData===true
    ||matchMedia("(max-width:820px)").matches||matchMedia("(prefers-reduced-motion:reduce)").matches){
   box.classList.add("on");return}
 var v=document.createElement("video");
 v.muted=v.loop=v.playsInline=v.autoplay=true;v.preload="auto";v.src=SITE.hero_bg_video_url||D.VID;
 // a slower or faster playback rate changes ONLY how quickly frames
 // are shown — the browser plays the exact same encoded frames either
 // way, so there is no re-encoding and no quality loss at any speed
 v.playbackRate = heroVideoSpeed();
 v.addEventListener("canplay",function(){box.classList.add("on")},{once:true});
 box.appendChild(v);v.play().catch(function(){box.classList.add("on")});
 setTimeout(function(){box.classList.add("on")},2500);
 _heroVideoEl = v;
}

// shared by every background poller: true only when it's actually
// safe to silently re-render — i.e. nobody is in the middle of
// typing into a form that a re-render would wipe or interrupt
// (posting/editing a listing, admin editing a listing or an ad slot)
function safeToBackgroundRender(){
  if(VIEW==="post" || VIEW==="edit" || VIEW==="mapsearch") return false;
  if(VIEW==="admin" && ((ADM.editId!==null && ADM.editId!==undefined) || ADM.newAdOpen || ADM.editAdId)) return false;

function listingsSignature(list){
  // a lightweight fingerprint of everything that matters for "did the
  // results actually change" — id, status, price, and featured state
  // catch both new listings AND changes to existing ones (a status
  // flip, a price edit), not just brand-new IDs
  return list.map(function(x){ return x.id+":"+x.status+":"+x.p+":"+(x.featured?1:0) }).sort().join("|");
}
async function syncListingsFromServer(){
  if(!DB) return;
  try{
    var before = listingsSignature(D.LIST);
    await _loadListingsImpl();
    var after = listingsSignature(D.LIST);
    var changed = before !== after;
    // a full render() replaces the DOM via innerHTML, which would
    // interrupt anyone actively typing in a form (posting, editing,
    // searching) — only refresh the visible page when it's actually
    // safe to do so; the data itself still stays current in the
    // background for whenever the user does navigate
    if(changed && safeToBackgroundRender()) render();
  }catch(e){}
}
var _lastNavRefresh = 0;
function refreshListingsOnNavigate(){
  // the periodic 30s poll alone isn't enough: navigating (browser
  // back/forward, or any in-app link) previously showed whatever was
  // already sitting in memory with no fetch at all, so a listing
  // posted moments ago could stay invisible until the next poll tick
  // happened to land, or a hard refresh. This fires an immediate,
  // background-safe refresh on every navigation instead — throttled
  // so rapid clicking between pages doesn't spam requests.
  var now = Date.now();
  // previously 4000ms — long enough that opening a listing and then
  // immediately going back (a completely normal way to browse) could
  // silently swallow BOTH refresh attempts, landing back on stale
  // data. This only needs to be long enough to absorb an accidental
  // double-fire from the same click/event, not to survive a user
  // actually moving between two different pages in a couple of
  // seconds — which is the exact scenario that needs a fresh fetch.
  if(now - _lastNavRefresh < 800) return;
  _lastNavRefresh = now;
  syncListingsFromServer();
}

async function _loadListingsImpl(){

                .in("status",["live","pending"]).order("created_at",{ascending:false}).limit(200);
    if(res.error) throw res.error;

  }catch(e){

      var r2 = await DB.from("listings").select("*")
                 .in("status",["live","pending"]).order("created_at",{ascending:false}).limit(200);
      if(r2.error) throw r2.error;
      var gv = await DB.from("governorates").select("id,name_ar");

      var gmap={},amap={};
      (gv.data||[]).forEach(function(g){gmap[g.id]=g.name_ar});
      (ar.data||[]).forEach(function(a){amap[a.id]=a.name_ar});
      rows=escDeep((r2.data||[]).map(function(r){
        r.governorate_ar=gmap[r.governorate_id]; r.area_ar=amap[r.area_id]; return r}));
    }catch(e2){ DBERR=e2.message||String(e2);
      console.error("Balkoun: cannot read listings.", e2); return }
  }
  ONLINE = true; DBERR = "";

  try{ var ap = await DB.from("v_area_prices").select("*");
       if(!ap.error && ap.data){ AREA_PRICES = {}; ap.data.forEach(function(r){ AREA_PRICES[r.area_id] = r }) } }catch(e){}
  DBCOUNT = rows ? rows.length : 0;
  var mapped = (rows||[]).map(fromRow);

  // attach all photos for these listings
  if(mapped.length){
    try{
      var ids = mapped.map(function(x){return x.id});
      var ph = await DB.from("listing_photos").select("listing_id,url,thumb_url,sort_order")
                 .in("listing_id", ids).order("sort_order",{ascending:true});

  }

}

var _FIRST_HISTORY_SYNC = true;
function filterToQuery(){
  var q={};
  if(F.deal) q.deal=F.deal;
  if(F.govs&&F.govs.length) q.govs=F.govs.join(",");
  else if(F.g) q.g=F.g;
  if(F.areas&&F.areas.length) q.areas=F.areas.join(",");
  else if(F.a) q.a=F.a;
  if(F.types&&F.types.length) q.types=F.types.join(",");
  else if(F.t) q.t=F.t;
  if(F.tbs&&F.tbs.length) q.tbs=F.tbs.join(",");
  else if(F.tb) q.tb=F.tb;
  if(F.cd) q.cd=F.cd;
  if(F.furn) q.furn=F.furn;
  if(F.rentalPeriod) q.rp=F.rentalPeriod;
  if(F.pmin) q.pmin=F.pmin;
  if(F.pmax) q.pmax=F.pmax;
  if(F.ownerOnly) q.owner=1;
  if(F.sort && F.sort!=="new") q.sort=F.sort;
  if(F.page && F.page>1) q.page=F.page;
  var parts=Object.keys(q).map(function(k){ return k+"="+encodeURIComponent(q[k]) });
  return parts.length ? "?"+parts.join("&") : "";
}
function applyFilterFromQuery(qs){
  if(!qs) return;
  var params={};
  qs.replace(/^\?/,"").split("&").forEach(function(pair){
    if(!pair) return;
    var kv=pair.split("=");

function syncHash(){
  // Real page addresses (multi-page structure): /search?…, /post, /about, /listing/123 …
  // GitHub Pages serves 404.html (a copy of this file) for any path, so deep links work.
  var h = routePath();
  setPageMeta();
  // Consume the "first render" flag exactly once, unconditionally — even
  // when this call is a no-op below (hash already matches). Otherwise a
  // Home-page load (whose hash already matches "") would leave the flag
  // set, and the very next REAL navigation would wrongly replaceState
  // instead of pushState, erasing the Home entry from history.
  var isFirst = _FIRST_HISTORY_SYNC;
  _FIRST_HISTORY_SYNC = false;
  // Nothing to do if the address bar already matches — this covers both
  // in-place re-renders (typing, toggling filters) and the moment right
  // after the user pressed Back/Forward, when the browser has already
  // moved the hash and we're just catching up to it.
  if(location.pathname+location.search===h && !location.hash) return;
  try{
    if(isFirst){
      // The very first render (page load, a shared link, or an old #/ link) just
      // normalizes the URL — it shouldn't count as a "page" to go back to.
      history.replaceState(null,"",h);
    } else {
      // Every real navigation after that gets its own history entry, so
      // the browser's Back button steps back through the app instead of
      // leaving the site entirely.
      history.pushState(null,"",h);
    }
  }catch(e){}
}

/* opening: a navy curtain with the wordmark drawing in, lifted after ~1s to reveal the hero,

   browser session, never for a visitor who arrives on a listing link, and never when the
   visitor asked for reduced motion. */
var _openingActive=false,_openingT0=0;
function initOpening(){
  // plays on every load of the home page (a refresh included); in-app navigation back to home does not re-run it
  if(VIEW!=="home") return;

  setTimeout(function(){ c.classList.add("done") },950);

function heroChoreo(){
  if(!_openingActive || VIEW!=="home") return;

  var hd=document.querySelector("header"); if(hd){ hd.classList.add("choreo-hdr"); hd.style.animationDelay=base+"ms" }

  // trap the phone's bottom-sheet menus (position:fixed) inside the bar

    var el=$(p[0]); if(!el) return;
    el.classList.add("choreo"); el.style.animationDelay=(base+p[1])+"ms"; settle(el,"choreo");
  });
  // the headline slides in from its own side while the drawing shrinks away from it (they run together)

/* ── "Damascus in gold lines": hero_bg_type = sketch ──
   The curtain navy stays; gold lines draw Qasioun, the Umayyad Mosque and Damascene houses with
   their balconies (~2.6s, timed to the curtain lift), the drawing stays, and a soft shine travels
   along the lines every few seconds (SMIL, so it costs nothing while idle). Built once per load. */
var _sketch=null;
function sketchMount(){
  var box=$("#sketchBox"); if(!box) return;
  if(!_sketch) _sketch=sketchBuild();
  if(_sketch.el.parentNode!==box){ box.innerHTML=""; box.appendChild(_sketch.el) }
  if(_sketch.started && _sketch.refit) _sketch.refit();   // re-render: keep the finished picture fitted to the free space
  if(!_sketch.started){
    _sketch.started=true;
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce){ _sketch.finish(); return }
    var delay = _openingActive ? Math.max(0, 1000-(Date.now()-_openingT0)) : 200;
    setTimeout(function(){ _sketch.play() }, delay);
  }
}
function sketchBuild(){
  /* One continuous shot in a real 3D scene (CSS perspective). Everything exists at once in one world:
       the ground (roads, the old city, Umayyad Square with its ring gardens), and vertical planes standing on it:
       the Umayyad Mosque facade, the Qasioun backdrop with its masts, the Opera House, the Sheraton, the TV building,
       the fountain jets, palms, and the Damascus Sword on its plaza in front of the Opera.
     Only the camera moves: it pulls back from the mosque, rises to a bird's-eye view, glides west to the square
     while turning, then comes down to street level where the facades stand up and the Sword rises. Then it rests. */
  var NS="http://www.w3.org/2000/svg", GOLD="#E8BC6A", SOFT="#FFF3D0", EASE="cubic-bezier(.65,0,.35,1)", OUT="cubic-bezier(.2,.7,.2,1)";
  function S(tag,attrs,parent){ var e=document.createElementNS(NS,tag); for(var k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e }

/* scroll reveals: only when the page (VIEW) changes — re-renders caused by a filter click
   or a lightbox must not make content blink — and only for elements still below the fold,
   so nothing that is already visible ever fades. CSS is scoped to html.js. */
var _revealView=null,_revealAt=0;
function applyReveals(){
  if(!("IntersectionObserver" in window)) return;
  // the boot render is followed within a second or two by the render that brings the live
  // data, so a short grace window keeps the reveals for that second pass as well
  if(VIEW===_revealView && Date.now()-_revealAt>2500) return;
  if(VIEW!==_revealView){ _revealView=VIEW; _revealAt=Date.now(); }
  if(VIEW!=="home" && VIEW!=="search" && VIEW.indexOf("listing:")!==0) return;
  var vh=window.innerHeight||800;
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target) } }) },{rootMargin:"0px 0px -6% 0px"});
  var n=0;
  document.querySelectorAll(".sec, .band, .card, .govs a, .guide, .mkt, .coll, .typecell, .tlist>div, .nums>div").forEach(function(el,i){
    if(n>=80 || el.getBoundingClientRect().top < vh*0.92) return;
    el.classList.add("rv"); el.style.transitionDelay=((i%3)*60)+"ms"; io.observe(el); n++;
  });
}

/* the headline's last word flips every few seconds to the brand: الشرفة → منصة بلكون, balcony → Balkoun.com */
function heroSubHtml(txt){
  // the brand face: the letters of "balkoun" / "بلكون" light up one after the other like a wave.
  // Latin letters can also rise (inline-block); Arabic letters stay inline so they remain joined, and glow instead.
  var AR=["ﺑ","ﻠ","ﻜ","ﻮ","ﻥ"]; // ب ل ك و ن in their contextual shapes (initial, medial, medial, final, isolated)
  var alt = L==="ar" ? 'منصة <span class="plword" aria-label="بلكون">'+AR.map(function(ch,i){ return '<span class="pla" style="--i:'+i+'">'+ch+'</span>' }).join("")+'</span>'
          : 'www.'+"balkoun".split("").map(function(ch,i){ return '<span class="pl" style="--i:'+i+'">'+ch+'</span>' }).join("")+'.com';
  var m=String(txt||"").match(/^(.*?)(\S+?)([.!؟?]*)\s*$/);
  if(!m||!m[2]) return txt;
  var before=m[1], face1=m[2]+m[3];
  // "from the balcony" → "from www.balkoun.com": the article flips away together with the noun
  var art=L!=="ar" ? before.match(/(^|\s)(the|a|an|dem|der|die|das|den|vom|am|im|zum|zur)\s*$/i) : null;
  if(art){ before=before.slice(0,art.index+art[1].length); face1=art[2]+" "+face1 }
  return before+'<span class="flipw"><span class="flipw-in"><span class="f1">'+face1+'</span><span class="f2">'+alt+'</span></span></span>';
}

  var kindSel=function(v,id){ return '<select data-gk="'+id+'">'+["city","area","village"].map(function(k){return '<option value="'+k+'"'+(v===k?" selected":"")+'>'+GX(k)+'</option>'}).join("")+'</select>' };
  return '<div class="blk"><h3>'+GX("geoH")+'</h3><div class="in"><div class="hintx" style="margin-bottom:10px">'+GX("geoHint")+'</div>'+
   '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><select id="geoGov" style="padding:8px 12px;border:1px solid var(--line-2);border-radius:8px;font-size:14px">'+
     govs.map(function(x){return '<option value="'+x.id+'"'+(g&&x.id===g.id?" selected":"")+'>'+esc(x.name_ar)+' ('+x.areas+' · '+x.listings+' '+GX("listings")+')'+(x.enabled?"":" · ✕")+'</option>'}).join("")+'</select>'+
     (g&&g.slug?'<a class="mini" style="color:var(--navy);border-color:var(--line-2)" href="/for-sale/'+esc(g.slug)+'/" target="_blank" rel="noopener">'+GX("pages")+' ↗</a>':'')+
     '<span id="geoMsg" style="font-size:12.5px;color:var(--ok)"></span></div>'+
   (g?'<div class="geogov" style="display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:8px;align-items:center;padding:10px;background:var(--page);border-radius:8px;margin-bottom:12px">'+
     '<input data-gg="name_ar" value="'+esc(g.name_ar)+'" placeholder="'+GX("nameAr")+'"><input data-gg="name_en" value="'+esc(g.name_en||"")+'" placeholder="'+GX("nameEn")+'"><input data-gg="slug" value="'+esc(g.slug||"")+'" placeholder="'+GX("slug")+'" class="ltr">'+
     '<label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" data-gg="enabled"'+(g.enabled?" checked":"")+'>'+GX("shown")+'</label><button class="ab ok" id="geoGovSave">'+GX("save")+'</button></div>':'')+
   '<div class="geotable" style="display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr .5fr .5fr auto auto;gap:6px 8px;align-items:center;font-size:13.5px">'+
     '<b>'+GX("nameAr")+'</b><b>'+GX("nameEn")+'</b><b>'+GX("slug")+'</b><b>'+GX("kind")+'</b><b>'+GX("order")+'</b><b>'+GX("shown")+'</b><b>'+GX("listings")+'</b><b></b>'+
     rows.map(function(a){ return '<input data-ga="name_ar:'+a.id+'" value="'+esc(a.name_ar)+'"><input data-ga="name_en:'+a.id+'" value="'+esc(a.name_en||"")+'"><input data-ga="slug:'+a.id+'" value="'+esc(a.slug||"")+'" class="ltr">'+kindSel(a.kind,a.id)+
       '<input data-ga="sort_order:'+a.id+'" value="'+(a.sort_order||100)+'" type="number" style="width:64px"><input type="checkbox" data-ga="enabled:'+a.id+'"'+(a.enabled?" checked":"")+'><span class="ltr">'+a.listings+'</span>'+
       '<span style="display:flex;gap:4px"><button class="ab ok" data-geosave="'+a.id+'">'+GX("save")+'</button>'+(a.listings>0?'':'<button class="ab" data-geodel="'+a.id+'" style="color:var(--danger)">'+GX("del")+'</button>')+'</span>' }).join("")+
     '<input id="geoNewName" placeholder="'+GX("nameAr")+'" style="border-color:var(--gold)"><input id="geoNewEn" placeholder="'+GX("nameEn")+'"><input id="geoNewSlug" placeholder="'+GX("slug")+'" class="ltr">'+kindSel("area","new")+'<input id="geoNewOrder" type="number" value="100" style="width:64px"><span></span><span></span><button class="ab ok" id="geoAdd">'+GX("add")+'</button>'+
   '</div></div></div>';
}
function wireGeoAdmin(){
  if(ADM.tab!=="geo") return;
  if(!ADM._geoLoaded){ ADM._geoLoaded=true; DB.rpc("bk_admin_geo_list",{p_token:ADM.token}).then(function(r){ if(r&&r.data){ ADM.geo=r.data; render() } }); return }
  var msg=function(s,bad){ var m=$("#geoMsg"); if(m){ m.textContent=s; m.style.color=bad?"var(--danger)":"var(--ok)" } };
  var reload=function(){ return DB.rpc("bk_admin_geo_list",{p_token:ADM.token}).then(function(r){ if(r&&r.data) ADM.geo=r.data; loadGeo(); render() }) };
  var err=function(e){ var m=(e&&e.message)||""; msg(m.indexOf("slug_taken")>-1?GX("slugTaken"):m.indexOf("has_listings")>-1?GX("hasListings"):m||"error",true) };
  if($("#geoGov")) $("#geoGov").onchange=function(){ ADM.geoGov=parseInt(this.value,10); render() };
  if($("#geoGovSave")) $("#geoGovSave").onclick=function(){
    var row={id:ADM.geoGov}; $$("[data-gg]").forEach(function(i){ row[i.dataset.gg]= i.type==="checkbox" ? i.checked : i.value });
    DB.rpc("bk_admin_gov_save",{p_token:ADM.token,p_row:row}).then(function(r){ if(r.error) return err(r.error); msg(GX("saved")); reload() }) };
  $$("[data-geosave]").forEach(function(b){ b.onclick=function(){
    var id=b.dataset.geosave, row={id:parseInt(id,10), governorate_id:ADM.geoGov};
    $$('[data-ga$=":'+id+'"]').forEach(function(i){ var k=i.dataset.ga.split(":")[0]; row[k]= i.type==="checkbox" ? i.checked : i.value });
    var ks=$('[data-gk="'+id+'"]'); if(ks) row.kind=ks.value;
    DB.rpc("bk_admin_area_save",{p_token:ADM.token,p_row:row}).then(function(r){ if(r.error) return err(r.error); msg(GX("saved")); reload() }) } });
  $$("[data-geodel]").forEach(function(b){ b.onclick=function(){ if(!confirm(GX("confirmDel"))) return;
    DB.rpc("bk_admin_area_delete",{p_token:ADM.token,p_id:parseInt(b.dataset.geodel,10)}).then(function(r){ if(r.error) return err(r.error); msg(GX("saved")); reload() }) } });
  if($("#geoAdd")) $("#geoAdd").onclick=function(){
    var name=($("#geoNewName").value||"").trim(); if(!name) return;
    var row={governorate_id:ADM.geoGov, name_ar:name, name_en:$("#geoNewEn").value, slug:$("#geoNewSlug").value, kind:$('[data-gk="new"]').value, sort_order:$("#geoNewOrder").value, enabled:true};
    DB.rpc("bk_admin_area_save",{p_token:ADM.token,p_row:row}).then(function(r){ if(r.error) return err(r.error); msg(GX("saved")); reload() }) };
}
function updateHdr(){
 var h=document.querySelector("header"); if(!h) return;
 var y=window.pageYOffset||document.documentElement.scrollTop||0;
 h.classList.toggle("hdr-solid", document.body.classList.contains("home-hero") && y>30);
}
window.addEventListener("scroll",updateHdr,{passive:true});
// custom cursor removed 2026-09-04 (confused visitors; hover states carry the affordance)
DEMO = D.LIST.slice();
USER = loadSession();
if(USER && USER.preferred_currency){ CUR=USER.preferred_currency; try{localStorage.setItem("balkoun_cur",CUR)}catch(e){} }
try{ ADM.token=localStorage.getItem("balkoun_adm")||null }catch(e){}
var _h=viewFromHash(); if(_h) VIEW=_h;
initOpening();
document.addEventListener("keydown",function(e){
  if(e.key==="Escape") $$(".menu.on,.chipsel-drop.on").forEach(function(m){ m.classList.remove("on") });
});
if(VIEW.indexOf("listing:")===0 && DB){
  fetchOne(VIEW.split(":")[1]).then(function(r){ if(r) render() }); }
if(VIEW.indexOf("by:")===0 && DB){
  // a direct link or a hard refresh lands here with VIEW already
  // correctly restored from the URL, but BYUSER itself was never
  // populated — normally that only happens via the click handler on
  // a "view profile" link, which never runs on a fresh page load
  var byUid=VIEW.split(":")[1];
  BYUSER={id:byUid,name:"",rows:[]};
  loadByUser(byUid).then(function(){ render() });
}
window.onpopstate=window.onhashchange=function(){var v=viewFromHash(); if(v&&v!==VIEW){VIEW=v;render();refreshListingsOnNavigate()} else if(location.hash){ _FIRST_HISTORY_SYNC=true; syncHash() }};
document.addEventListener("keydown",function(e){
  if(!LIGHTBOX_OPEN) return;
  if(e.key==="Escape"){ LIGHTBOX_OPEN=false; render() }
  else if(e.key==="ArrowLeft"){ navigateLightbox(rtlNow()?1:-1) }
  else if(e.key==="ArrowRight"){ navigateLightbox(rtlNow()?-1:1) }
});
// avoids a redundant fetch right on page load — the boot sequence
// already fetches listings on its own a few lines down, so the
// centralized "view changed since last render" check inside render()
// shouldn't treat this very first call as a navigation too
_lastRenderedView = VIEW;
render();
if(VIEW==="admin"&&ADM.token) adminLoad();
/* a saved session can outlive a database rebuild — check it's real.
   Critically: only an EXPLICIT "this user record doesn't exist"
   response from the server clears the session. A network hiccup, a
   timeout, or any other transient failure (the .catch() below, or a
   generic RPC-level error with no data at all) says nothing about
   whether the session is actually valid — it was previously treated
   as an automatic logout, which is why refreshing a few times in a
   row (each one re-running this same check) could eventually log
   someone out of a perfectly valid session for no real reason. */
if(USER&&DB){
  DB.rpc("bk_me",{p_id:USER.id, p_token:USER.token||null}).then(function(r){
    if(r && r.data && r.data.error){ USER=null; clearSession(); render(); return }
    if(!r || r.error || !r.data) return; // couldn't confirm either way — leave the existing session alone
    USER=r.data; saveSession(USER); render();
    loadSaved().then(render);
    loadNotifications().then(render);
    startNotifPolling();
  }).catch(function(){ /* network/connection failure — not a verdict on the session, so it stays as-is */ });
}
applyGeoCache();
Promise.all([loadListings(),loadCounts(),loadSiteContent(),loadAdSlots(),loadGeo()]).then(function(){ render(); initCursor(); startAdRotation(); startAdCarouselRotation(); startBannerRotation(); startFeaturedPolling(); startListingsPolling() });
</script></body></html>
