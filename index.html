.topbanner-wrap{padding-top:8px;position:relative;z-index:2}
.topbanner-row{position:relative}
.topbanner-col{position:absolute;top:0;left:calc((100% - min(var(--banner-w,728px),100%)) * var(--banner-hpos,.5));max-width:100%}
.topbanner{display:block;width:var(--banner-w,728px);max-width:100%;
  margin-bottom:var(--banner-gap,14px);aspect-ratio:var(--banner-ratio,728/90);
  border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 2px 10px -4px rgba(9,14,26,.2);position:relative}
.topbanner-media{width:100%;height:100%;position:relative;overflow:hidden}
.topbanner-item{position:absolute;inset:0;opacity:0;visibility:hidden;display:block}
.topbanner-item.on{opacity:1;visibility:visible;z-index:1}
.topbanner-item img,.topbanner-item video{width:100%;height:100%;object-fit:contain;display:block}
/* fade — a simple cross-fade between the outgoing and incoming ad */
.topbanner-item.leaving-fade{animation:tbFadeOut .6s ease forwards;z-index:2}
.topbanner-item.entering-fade{animation:tbFadeIn .6s ease forwards;z-index:2}
@keyframes tbFadeOut{from{opacity:1}to{opacity:0}}
@keyframes tbFadeIn{from{opacity:0}to{opacity:1}}
/* slide-left — the new ad slides in from the right, pushing the old one out to the left */
.topbanner-item.leaving-slide-left{animation:tbSlideOutLeft .6s ease forwards;z-index:1}
.topbanner-item.entering-slide-left{animation:tbSlideInFromRight .6s ease forwards;z-index:2}
@keyframes tbSlideOutLeft{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@keyframes tbSlideInFromRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
/* slide-right — the reverse: new ad enters from the left, old one exits right */
.topbanner-item.leaving-slide-right{animation:tbSlideOutRight .6s ease forwards;z-index:1}
.topbanner-item.entering-slide-right{animation:tbSlideInFromLeft .6s ease forwards;z-index:2}
@keyframes tbSlideOutRight{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes tbSlideInFromLeft{from{transform:translateX(-100%)}to{transform:translateX(0)}}
/* slide-up — new ad rises in from the bottom, old one exits upward */
.topbanner-item.leaving-slide-up{animation:tbSlideOutUp .6s ease forwards;z-index:1}
.topbanner-item.entering-slide-up{animation:tbSlideInFromBottom .6s ease forwards;z-index:2}
@keyframes tbSlideOutUp{from{transform:translateY(0)}to{transform:translateY(-100%)}}
@keyframes tbSlideInFromBottom{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* slide-down — new ad drops in from the top, old one exits downward */
.topbanner-item.leaving-slide-down{animation:tbSlideOutDown .6s ease forwards;z-index:1}
.topbanner-item.entering-slide-down{animation:tbSlideInFromTop .6s ease forwards;z-index:2}
@keyframes tbSlideOutDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes tbSlideInFromTop{from{transform:translateY(-100%)}to{transform:translateY(0)}}

/* every password field on the site already has its own custom
   show/hide eye button (built above) — browsers like Edge/IE inject
   their own native reveal icon into ANY <input type="password"> the
   instant the user starts typing, regardless of whether one exists
   already, which is exactly what showed up as "two eye icons".
   Hiding the browser's own controls here, site-wide, avoids that. */
input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear{display:none}
input[type="password"]::-webkit-credentials-auto-fill-button,
input[type="password"]::-webkit-strong-password-auto-fill-button{
  visibility:hidden;display:none !important;pointer-events:none;position:absolute;right:0}

/* z-index:1150 — safely above every regular page-level element
   (including the map search page's own top row at 1091, which is
   exactly what was silently painting over these dropdowns whenever
   they overlapped it — the actual cause of both the language
   dropdown and the "More" menu appearing to open "behind" things
   specifically on that page), while still correctly staying below
   the lightbox (1200) and the auth modal (1300) it's meant to. Since
   every dropdown built on top of this class (the "More" nav menu,
   the language switcher, the account menu, notifications) is global
   navigation, it should always layer above ordinary page content,
   not just most of it. */

/* ══ 2026-09 design refresh ═══════════════════════════════════════════
   One type scale (16 body / 14 secondary / 12.5 smallest), three radii
   (4 / 8 / 12), price as the only bold element on a card, grouped
   property types, and a header that fits a phone. Kept as one block
   at the end so it overrides the older rules above without editing
   them one by one. ═══════════════════════════════════════════════════ */
:root{--r:8px;--r-s:4px;--r-l:12px;--warn:#B45309}
body{font-size:16px}
.hnav{font-size:15px}
.mini{font-size:13px;padding:7px 12px}
.gold{font-size:14px}
.crumb{font-size:13.5px}
.sec{padding:40px 0 8px}
.sec h2{font-size:24px}
.sec .sub{font-size:15px}
.hnote{font-size:14.5px}
.stabs button{font-size:14.5px}
.sf label{font-size:12.5px}
.sgo{font-size:16px}
/* cards: price is the one bold thing; everything else steps down in weight and colour */
.cb .p{font-size:20px}
.cb-loc{font-size:14px;font-weight:600;color:var(--ink)}
.cb-details{font-size:13px;color:var(--grey)}
.cb-type{font-weight:500;color:var(--grey)}
.cb-poster{color:var(--grey)}
.cb .d{font-size:12.5px}
.cb-photoicons{font-size:13px}
.bd span{font-size:12px;border-radius:var(--r-s)}
.nph{font-size:12px;border-radius:var(--r-s)}
.tabu-green{color:var(--ok);font-weight:600}
option[value="green"]{color:var(--ok);font-weight:600}
.chipsel-opt .tabu-green,.cs-sum .tabu-green,.chip .tabu-green{color:var(--ok)}
/* property-type families on the home page */
.typegroup{margin-top:18px}
.typegroup h3{font-size:14.5px;font-weight:700;color:var(--grey);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px}
[dir="rtl"] .typegroup h3{text-transform:none;letter-spacing:0}
.typegrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.typecell{border-radius:var(--r);padding:14px 16px}
.typecell b{font-size:15.5px}
.typecell span{font-size:13px;background:var(--navy-w);color:var(--navy);padding:2px 9px;border-radius:12px;font-weight:600}
/* radii: 4 / 8 / 12 only */
.tile,.guide,.band,.sbar,.profcard,.mappin-popup-custom,.leaflet-popup-content-wrapper{border-radius:var(--r-l)}
.stabs{border-radius:var(--r-l) var(--r-l) 0 0}
.sgo{border-radius:0 0 var(--r-l) var(--r-l)}
.govs a,.pg a,.fg select,.fg input,.chipsel-box,.topbar select,.card,.panel,.typecell{border-radius:var(--r)}
.vbadge,.chip{border-radius:var(--r-s)}
/* secondary text sizes across the home and search pages */
.govs a{font-size:15px}.govs span{font-size:13px}
.tile h3{font-size:17px}.tile p{font-size:14px}.tile .cnt{font-size:13px}
.guide h3{font-size:17px}.guide p{font-size:14px}.guide .k{font-size:12.5px}
.band h2{font-size:24px}.band p{font-size:15px}.bandlist{font-size:14px}
footer{font-size:14px}
.fg h4{font-size:12.5px}.fg select,.fg input,.ck{font-size:14.5px}.ck .c{font-size:12.5px}
.topbar h1{font-size:22px}.topbar .n{font-size:14px}.topbar select{font-size:14px}
.keys b{font-size:18px}.keys span{font-size:12.5px}
.mappin-price{font-size:16px}.mappin-loc{font-size:12.5px}.mappin-type{font-size:13px}
/* header on phones: short login label, smaller chips, the floating post button replaces the header one */
.lbl-short{display:none}
@media(max-width:640px){
  .lbl-full{display:none}.lbl-short{display:inline}
  .hbar{gap:8px;height:58px}
  .htools{gap:6px}
  .mini{padding:6px 9px;font-size:12.5px;white-space:nowrap}
  .logo{font-size:17px;padding:4px 10px}
  .htools .gold{display:none}
  .chip2{font-size:12.5px;padding:4px 9px 4px 5px}
  .hero{min-height:0;padding:22px 0 18px}

}
/* ── listing page ── */

.gal img.main{aspect-ratio:16/10;max-height:64vh}

@media(max-width:960px){
  .contactbar{display:flex;gap:10px;position:fixed;bottom:0;inset-inline:0;z-index:1090;background:#fff;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    box-shadow:0 -6px 18px -8px rgba(9,14,26,.25)}
  .contactbar a,.contactbar button{flex:1;text-align:center;font:inherit;font-weight:700;font-size:15px;
    padding:12px;border-radius:var(--r);border:none;cursor:pointer;text-decoration:none;display:block}
  .cb-call{background:var(--navy);color:#fff}
  .cb-wa{background:#1FA855;color:#fff}
  .page2{padding-bottom:96px}
}
@media(max-width:640px){
  /* thumbnails become one scrollable strip instead of wrapping into a second row */
  .thumbs{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none}
  .thumbs::-webkit-scrollbar{display:none}
  .thumbs img{width:76px;flex:0 0 76px}

/* ══ 2026-09 motion & elegance pass (ported from the approved mockup) ══════
   display face for the brand and headings, a quieter logo, animated nav
   underline, slow zoom on the hero photo/video, a custom cursor on
   desktop, scroll reveals (JS adds .rv only to elements below the fold,
   only on a page change), and the "market pulse" ticker fed by v_area_prices */
:root{--fd:'Noto Kufi Arabic','Lato',system-ui,sans-serif}
.hero h1,.sec h2,.band h2,.logo,.topbar h1{font-family:var(--fd)}
.hero h1{letter-spacing:-.005em;line-height:1.35}
.logo{border:0;padding:4px 0;font-size:24px;letter-spacing:.01em;line-height:1}
@media(max-width:640px){.logo{padding:4px 0;font-size:21px}}
.hnav a{position:relative;padding:4px 0}
.hnav a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
[dir=ltr] .hnav a::after{transform-origin:left}
.hnav a:hover::after{transform:scaleX(1)}
.gold,.sgo,.mini,.btn{transition:background .25s,color .25s,border-color .25s,transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
.gold:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(196,136,31,.7)}
/* hero: slow cinematic zoom */
.hv img,.hv video{transform-origin:center;will-change:transform}
.hv.on img,.hv.on video{animation:heroKb 26s ease-in-out infinite alternate}
@keyframes heroKb{from{transform:scale(1)}to{transform:scale(1.07)}}
/* market pulse ticker (home, under the hero) */
.mkt{display:flex;align-items:stretch;background:#fff;border-bottom:1px solid var(--line);font-size:13.5px;overflow:hidden}
.mkt-lab{flex:none;display:flex;align-items:center;gap:8px;padding:11px 18px;font-weight:700;border-inline-end:1px solid var(--line);color:var(--navy);white-space:nowrap;background:#fff;z-index:1}
.mkt-lab i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(196,136,31,.5);animation:mktPulse 2s infinite}
@keyframes mktPulse{70%{box-shadow:0 0 0 9px rgba(196,136,31,0)}100%{box-shadow:0 0 0 0 rgba(196,136,31,0)}}
.mkt-win{flex:1;overflow:hidden;display:flex;align-items:center;-webkit-mask:linear-gradient(to left,transparent,#000 5%,#000 95%,transparent);mask:linear-gradient(to left,transparent,#000 5%,#000 95%,transparent)}
.mkt-track{display:flex;width:max-content;animation:mktR 70s linear infinite}
[dir=ltr] .mkt-track{animation-name:mktL}
.mkt:hover .mkt-track{animation-play-state:paused}
@keyframes mktR{from{transform:translateX(0)}to{transform:translateX(50%)}}
@keyframes mktL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mkt-track ul{display:flex;list-style:none;margin:0;padding:0}
.mkt-track li{display:flex;align-items:center;gap:8px;padding:11px 20px;white-space:nowrap;color:var(--grey)}
.mkt-track li a{color:var(--ink);font-weight:600;cursor:pointer}
.mkt-track li a:hover{color:var(--gold)}
.mkt-track li small{color:var(--light);font-size:12px}
.mkt-track li b{color:var(--navy);font-weight:700}
.mkt-track li::after{content:"";width:3px;height:3px;border-radius:50%;background:var(--gold);margin-inline-start:14px;opacity:.75;flex:none}
.mkt-note{color:var(--light)!important;font-size:12.5px}
@media(max-width:640px){.mkt{font-size:12.5px}.mkt-lab{padding:9px 12px}.mkt-track li{padding:9px 14px}}
@media (prefers-reduced-motion:reduce){
  .mkt-track{animation:none}.mkt-win{overflow-x:auto;-webkit-mask:none;mask:none}.mkt-lab i{animation:none}
  .hv.on img,.hv.on video{animation:none}.cur{display:none}
  .hnav a::after{transition:none}}

/* ── opening curtain + hero choreography ── */
.curtain{position:fixed;inset:0;z-index:100000;background:radial-gradient(120% 90% at 50% 30%,#1B2C52,var(--navy) 70%);display:grid;place-items:center;transition:transform .95s cubic-bezier(.76,0,.24,1);will-change:transform}
/* the navy stays where it is (it is the hero's own colour); only the word lifts away, then the curtain fades to reveal the drawing */
.curtain{transition:opacity .6s ease .5s}
.curtain.done{opacity:0}
.curtain.done .cw{animation:curUp .85s cubic-bezier(.6,0,.2,1) forwards}
@keyframes curUp{to{transform:translateY(-55vh);opacity:0}}
.curtain.done .cw::after{animation:none;opacity:0;transition:opacity .3s}
.curtain .cw{font-family:var(--fd);font-weight:700;font-size:clamp(44px,7vw,76px);color:var(--gold);line-height:1.1;overflow:hidden;position:relative;padding:0 6px 12px}
.curtain .cw span{display:inline-block;transform:translateY(110%);animation:curRise .8s cubic-bezier(.2,.7,.2,1) .1s forwards}
.curtain .cw::after{content:"";position:absolute;inset-inline-end:6px;bottom:4px;height:2px;width:0;background:var(--gold);animation:curLine .7s cubic-bezier(.2,.7,.2,1) .5s forwards}
@keyframes curRise{to{transform:none}}
@keyframes curLine{to{width:calc(100% - 12px)}}
.choreo{animation:heroRise .9s cubic-bezier(.2,.7,.2,1) both}
.choreo-hdr{animation:hdrIn .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes hdrIn{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
.sbar.choreo,.mkt.choreo{animation-name:heroRiseFar}
@keyframes heroRiseFar{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:none}}
/* headline: slides in from its reading side (left in English/German, right in Arabic) while the drawing moves aside */
.choreo-slide{animation:heroSlide 1.7s cubic-bezier(.65,0,.25,1) both;--slide:-140px}
[dir=rtl] .choreo-slide{--slide:140px}
@keyframes heroSlide{from{opacity:0;transform:translateX(var(--slide))}60%{opacity:1}to{opacity:1;transform:none}}
/* the last word of the headline flips to the brand every few seconds */
.flipw{display:inline-grid;perspective:900px;vertical-align:bottom;white-space:nowrap}
.flipw-in{grid-area:1/1;display:inline-grid;transform-style:preserve-3d;animation:flipWord 9s cubic-bezier(.7,0,.3,1) 4.5s infinite;transform-origin:50% 50%}
.flipw .f1,.flipw .f2{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipw .f2{transform:rotateX(180deg)}
@keyframes flipWord{0%,40%{transform:rotateX(0)}48%,90%{transform:rotateX(-180deg)}98%,100%{transform:rotateX(-360deg)}}
/* while the brand face shows (48%–90% of the 9s cycle): a double heartbeat runs through the letters, one after the other */
.flipw .pl{display:inline-block;transform-origin:50% 85%;animation:letterBeat 9s cubic-bezier(.3,0,.2,1) infinite;animation-delay:calc(4.5s + var(--i)*.075s)}
@keyframes letterBeat{0%,53%{transform:none;color:inherit}56.5%{transform:translateY(-12%) scale(1.3);color:#FFF6DC}61%{transform:none;color:inherit}100%{transform:none}}
.flipw .plword{display:inline-block;white-space:nowrap;direction:rtl;unicode-bidi:isolate}
.flipw .pla{display:inline-block;transform-origin:50% 86%;animation:letterBeatAr 9s cubic-bezier(.3,0,.2,1) infinite;animation-delay:calc(4.5s + var(--i)*.09s)}
@keyframes letterBeatAr{0%,53%{transform:none;color:inherit;text-shadow:inherit}56.5%{transform:scale(1.22);color:#FFF6DC;text-shadow:0 0 16px rgba(255,246,220,.9)}61%{transform:none;color:inherit;text-shadow:inherit}100%{transform:none}}

، بل مشكلة معلومات ناقصة — وهي بالضبط ما بنينا هذه المنصّة لحلّه."]], ["ما الذي نفعله بشكل مختلف", ["<b>السعر إلزامي.</b> لا يُنشر أي إعلان في بلكون دون سعر مكتوب. لا «للجادّين فقط»، ولا «السعر على الخاص». الرقم أمامك من النظرة الأولى.", "<b>حالة الطابو إلزامية.</b> أخضر، أو أسهم، أو حكم محكمة، أو وكالة — مذكورة في كل إعلان ويمكن الفلترة بها. هذا أول سؤال يطرحه أي مشترٍ سوري، وهو أول ما تجده هنا.", "<b>حالة العقار بصراحة.</b> سليم، أو يحتاج ترميماً، أو على العظم، أو متضرّر. حتى لا يقطع أحد البلاد ليجد أطلالاً.", "<b>ساعات الكهرباء والمياه.</b> معلومة تغيّر قيمة المنزل فعلياً، ولا يسجّلها أي موقع عقاري في العالم. لدينا موجودة.", "<b>صور حقيقية، وثلاث على الأقل.</b> وكل إعلان جديد يمرّ على المراجعة قبل النشر."]], ["من المالك مباشرةً", ["لا نتقاضى عمولة، ولا نتوسّط في البيع، ولا يمرّ عبرنا أي مبلغ. نوصلك بصاحب العقار فحسب، وما بعد ذلك بينكما.", "ولأننا لسنا طرفاً في الصفقة، ليس لدينا أي سبب لإخفاء شيء عنك."]], ["لكل السوريين، ولغيرهم أيضاً", ["الموقع متاح بالعربية والإنكليزية والألمانية، لأن شريحة واسعة من المشترين اليوم يقيمون خارج البلاد — في ألمانيا وتركيا والخليج وكندا — ويريدون شراء منزل في وطن هم بعيدون عنه.", "لذلك نطلب فيديو للعقار، ونعرض ساعات الكهرباء، ونذكر حالة الطابو بوضوح: ليتمكّن من لا يستطيع الحضور للمعاينة من اتخاذ قراره."]], ["ما هو قادم", ["نعمل على قسم <b>الاستشارات القانونية</b> بالتعاون مع محامين مختصين بالعقارات — لفحص السند، وتوثيق الوكالة، ونقل الملكية بأمان، وخصوصاً لمن هم خارج سوريا.", "وبعد ذلك: تقارير أسعار لكل منطقة، وتنبيهات فور توفّر عقار يطابق مواصفاتك."]]], "ctaH": "لديك عقار للبيع أو للإيجار؟", "ctaP": "انشره مجاناً خلال دقيقتين. دون عمولة، ويصل إلى آلاف المهتمين داخل سوريا وخارجها."}, "en": {"h1": "We built this because we lived the problem", "lede": "Syrian developers who got tired of hunting for a home — so we built the place we wished existed.", "blocks": [["Why Balkoun", ["Anyone who has looked for a home in Syria knows the routine: a Facebook post with one photo, no price, no size, not even the exact area. You comment asking how much, and you wait. Sometimes a reply comes two days later. Often it never comes.", "Then you call, arrange a viewing, cross the city — and find the place sold a month ago, or the photos weren't of it, or the price is double what you were told.", "That wasted time isn't a technical problem. It's a missing-information problem, and it's exactly what we built this to fix."]], ["What we do differently", ["<b>The price is mandatory.</b> No listing goes up without one. No \"serious buyers only\", no \"price in DM\". The number is there from the first glance.", "<b>The title deed is mandatory.</b> Green tabu, shares, court ruling or power of attorney — declared on every listing and filterable. It's the first question every Syrian buyer asks, and here it's the first thing you see.", "<b>Honest condition.</b> Intact, needs repair, structural shell or damaged. So nobody crosses the country to see a ruin.", "<b>Power and water hours.</b> It genuinely changes what a home is worth, and no property site in the world records it. Ours does.", "<b>Real photos, minimum three.</b> And every new listing is reviewed before it appears."]], ["Straight from the owner", ["We take no commission, we don't broker the sale, and no money passes through us. We connect you to the owner — the two of you agree the rest.", "And because we're not a party to the deal, we have no reason to hide anything from you."]], ["For Syrians, and for everyone else", ["The site is in Arabic, English and German, because a large share of today's buyers live abroad — in Germany, Türkiye, the Gulf and Canada — and want to buy a home in a country they're far from.", "That's why we ask for a walkthrough video, show the power hours, and state the deed plainly: so someone who can't visit in person can still decide."]], ["What's coming", ["We're building a <b>legal consultation</b> service with lawyers who specialise in property — to check a deed, notarise a power of attorney, and transfer ownership safely, especially if you're outside Syria.", "After that: price reports by area, and alerts when something matching your search appears."]]], "ctaH": "Have a property to sell or rent?", "ctaP": "List it free in two minutes. No commission, and it reaches thousands of people inside Syria and abroad."}, "de": {"h1": "Wir haben das gebaut, weil wir das Problem selbst kennen", "lede": "Syrische Entwickler, die es leid waren, eine Wohnung zu suchen — und den Ort gebaut haben, den sie sich gewünscht hätten.", "blocks": [["Warum Balkoun", ["Wer in Syrien eine Wohnung sucht, kennt das: ein Facebook-Post mit einem Foto, ohne Preis, ohne Fläche, ohne genaue Lage. Man fragt in den Kommentaren nach dem Preis — und wartet. Manchmal kommt nach zwei Tagen eine Antwort. Oft gar keine.", "Dann ruft man an, vereinbart eine Besichtigung, fährt quer durch die Stadt — und erfährt, dass die Wohnung längst verkauft ist, die Fotos nicht dazugehörten oder der Preis doppelt so hoch ist.", "Das ist kein technisches Problem, sondern ein Informationsproblem. Genau dafür haben wir das hier gebaut."]], ["Was wir anders machen", ["<b>Der Preis ist Pflicht.</b> Keine Anzeige ohne Preis. Kein „Preis auf Anfrage\". Die Zahl steht auf den ersten Blick da.", "<b>Der Grundbuchstatus ist Pflicht.</b> Grünes Grundbuch, Anteile, Gerichtsurteil oder Vollmacht — in jeder Anzeige angegeben und filterbar.", "<b>Ehrlicher Zustand.</b> Intakt, renovierungsbedürftig, Rohbau oder beschädigt.", "<b>Strom- und Wasserzeiten.</b> Das beeinflusst den Wert wirklich — und keine Immobilienplattform der Welt erfasst es. Unsere schon.", "<b>Echte Fotos, mindestens drei.</b> Jede neue Anzeige wird vor der Veröffentlichung geprüft."]], ["Direkt vom Eigentümer", ["Wir nehmen keine Provision, vermitteln nicht und wickeln kein Geld ab. Wir stellen den Kontakt her — alles Weitere klären Sie direkt.", "Und weil wir nicht an der Transaktion beteiligt sind, haben wir keinen Grund, Ihnen etwas zu verschweigen."]], ["Für Syrer — und für alle anderen", ["Die Seite gibt es auf Arabisch, Englisch und Deutsch, denn viele Käufer leben heute im Ausland und möchten eine Immobilie in der Heimat kaufen.", "Deshalb bitten wir um ein Rundgang-Video, zeigen die Stromzeiten und nennen den Grundbuchstatus klar."]], ["Was als Nächstes kommt", ["Wir bauen einen Bereich für <b>Rechtsberatung</b> mit auf Immobilien spezialisierten Anwälten — Grundbuchprüfung, beglaubigte Vollmacht und sichere Eigentumsübertragung.", "Danach: Preisberichte je Gebiet und Benachrichtigungen bei passenden Angeboten."]]], "ctaH": "Sie möchten eine Immobilie anbieten?", "ctaP": "Kostenlos in zwei Minuten. Ohne Provision, sichtbar für Tausende in Syrien und im Ausland."}}, "LANDC": {"empty": ["أرض فارغة", "Empty plot", "Unbebautes Grundstück"], "built": ["عليها بناء", "Has a building", "Mit Gebäude"], "fenced": ["مسوّرة", "Fenced", "Eingezäunt"], "planted": ["مزروعة", "Planted", "Bepflanzt"]}, "DIR": {"s": ["قبلي (جنوبي)", "South-facing (qibli)", "Nach Süden (qibli)"], "n": ["شمالي", "North-facing", "Nach Norden"], "e": ["شرقي", "East-facing", "Nach Osten"], "w": ["غربي", "West-facing", "Nach Westen"], "se": ["قبلي شرقي", "Southeast-facing", "Nach Südosten"], "sw": ["قبلي غربي", "Southwest-facing", "Nach Südwesten"], "ne": ["شمالي شرقي", "Northeast-facing", "Nach Nordosten"], "nw": ["شمالي غربي", "Northwest-facing", "Nach Nordwesten"]}, "LANDAMEN": {"ar": ["سور", "بئر ماء", "كهرباء واصلة", "ماء واصل", "طريق معبّد", "أرض مستوية", "داخل التنظيم", "مفرزة", "إطلالة", "قريبة من الطريق العام"], "en": ["Fence", "Water well", "Electricity connected", "Water connected", "Paved road", "Level ground", "Inside zoning plan", "Subdivided", "View", "Near main road"], "de": ["Zaun", "Brunnen", "Stromanschluss", "Wasseranschluss", "Befestigte Straße", "Ebenes Gelände", "Im Bebauungsplan", "Parzelliert", "Aussicht", "Nahe Hauptstraße"]}};

function detectLang(){
  try{
    var saved = localStorage.getItem("balkoun_lang");
    if(saved && D.I18N[saved]) return saved;
  }catch(e){}
  try{
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language||navigator.userLanguage||""];
    for(var i=0;i<langs.length;i++){
      var c=(langs[i]||"").toLowerCase();
      if(c.indexOf("ar")===0) return "ar";
      if(c.indexOf("de")===0) return "de";
    }
  }catch(e){}
  return "en";
}
function detectCurrency(){
  try{
    var saved = localStorage.getItem("balkoun_cur");
    if(saved==="USD"||saved==="SYP") return saved;
  }catch(e){}
  return "USD"; // US dollar is the default for new visitors, per site owner's preference
}

  var out="", words=s.split(" ");

/* hash in the browser so the raw password never leaves the device;
   the database salts and hashes it again before storing.          */
async function sha(txt){
  var b=new TextEncoder().encode("balkoun:"+txt);
  var h=await crypto.subtle.digest("SHA-256",b);
  return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}

async function rpc(fn,args){
  if(!DB) throw new Error("noDb");
  args=args||{};
  // member functions verify a session token server-side; attach the current one automatically
  if(MEMBER_FNS[fn] && args.p_token===undefined) args.p_token=(USER&&USER.token)||null;
  var r=await DB.rpc(fn,args);
  if(r.error) throw r.error;
  if(r.data&&r.data.error) throw new Error(r.data.error);
  // several functions hand back the caller's own profile without the token — keep the session
  if(r.data && USER && USER.token && !r.data.token && r.data.id===USER.id && r.data.phone) r.data.token=USER.token;
  return r.data}
/* ── HTML escaping ───────────────────────────────────────────────────
   Every view builds HTML by string concatenation, so anything that came
   from the database is escaped once, at the boundary (see the DB.rpc hook
   after createClient and the direct .from() reads). Use unesc() in the
   few places where such a value goes somewhere that is NOT HTML (a
   WhatsApp message, a URL, an input's .value property). ── */
var ESC_MAP={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
function esc(s){ return s==null ? "" : String(s).replace(/[&<>"']/g,function(c){ return ESC_MAP[c] }) }
function unesc(s){ return s==null ? "" : String(s).replace(/&amp;|&lt;|&gt;|&quot;|&#39;/g,function(e){
  return {"&amp;":"&","&lt;":"<","&gt;":">","&quot;":'"',"&#39;":"'"}[e] }) }
// keys whose string value is JSON text the client parses itself, or a secret — never escaped
var ESC_SKIP_KEYS={banners_config:1,banner_items:1,token:1,pass_hash:1,filters:1};
function safeUrl(u){ return /^(https?:\/\/|data:image\/|\/|#)/i.test(u) ? u : "" }
function escDeep(v,key){
  if(v==null) return v;
  if(typeof v==="string"){
    if(key && ESC_SKIP_KEYS[key]) return v;
    if(key && /url$/i.test(key)) return esc(safeUrl(v));
    return esc(v) }
  if(Array.isArray(v)) return v.map(function(x){ return escDeep(x,key) });
  if(typeof v==="object"){ var o={}; for(var k in v) o[k]=escDeep(v[k],k); return o }
  return v }
// functions whose result is the caller's own profile, a raw export, or already-safe: not escaped here
var ESC_EXEMPT_FNS={bk_admin_backup:1,bk_login:1,bk_register:1,bk_set_password:1,bk_me:1,bk_admin_login:1,
  bk_admin_switch_to_user:1,bk_update_profile:1,bk_set_avatar:1,bk_set_bio:1,bk_change_phone:1};

/* ── Leaflet on demand ───────────────────────────────────────────────
   Most visits never open a map, so the 160KB library (plus a blocking
   request to unpkg) is fetched only when a map container is about to
   be initialised. Leaflet claims the global "L", which this app already
   uses for the current language, so noConflict() hands the library
   back under LeafletLib and restores our L. ── */
var _leafletPromise = null;
function ensureLeaflet(){
  if(window.LeafletLib) return Promise.resolve(window.LeafletLib);
  if(_leafletPromise) return _leafletPromise;
  _leafletPromise = new Promise(function(resolve, reject){
    var css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    css.integrity = "sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="; css.crossOrigin = "";
    document.head.appendChild(css);
    var s = document.createElement("script");
    s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.integrity = "sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="; s.crossOrigin = "";
    s.onload = function(){
      var lib = window.L && window.L.noConflict ? window.L.noConflict() : window.L;
      window.LeafletLib = lib;
      resolve(lib) };
    s.onerror = function(){ _leafletPromise = null; reject(new Error("leaflet failed to load")) };
    document.head.appendChild(s);
  });
  return _leafletPromise }

/* ── storage goes through the bk-storage Edge Function, which checks the admin or member
   session token and the path before touching the bucket. The bucket itself no longer has
   public delete/update/upload policies. Both helpers keep the {data,error} shape the
   supabase-js calls they replace had, so every caller's error handling still applies. ── */
async function storageCall(body){
  var ctx = (ADM&&ADM.token) ? {role:"admin",token:ADM.token} : {role:"member",token:(USER&&USER.token)||null};
  var r = await fetch(CONFIG.supabaseUrl+"/functions/v1/bk-storage",{method:"POST",
    headers:{"Content-Type":"application/json","apikey":CONFIG.supabaseKey,"Authorization":"Bearer "+CONFIG.supabaseKey},
    body:JSON.stringify(Object.assign({},body,ctx))});
  var j = null; try{ j = await r.json() }catch(e){ j = {} }
  // an admin whose panel session expired may still be a valid member — retry once as one
  if(r.status===401 && ctx.role==="admin" && USER && USER.token){
    r = await fetch(CONFIG.supabaseUrl+"/functions/v1/bk-storage",{method:"POST",
      headers:{"Content-Type":"application/json","apikey":CONFIG.supabaseKey,"Authorization":"Bearer "+CONFIG.supabaseKey},
      body:JSON.stringify(Object.assign({},body,{role:"member",token:USER.token}))});
    try{ j = await r.json() }catch(e){ j = {} }
  }
  if(!r.ok || (j&&j.error)) throw new Error((j&&j.error) || ("storage "+r.status));
  return j }
async function storageRemove(paths){
  try{ var j = await storageCall({action:"remove", paths:paths});
       return {data:(j.removed||[]).map(function(n){ return {name:n} }), error:null} }
  catch(e){ return {data:null, error:e} } }
async function storageUpload(path, file, opts){
  // Uploads still go straight to the bucket: its insert policy only allows the known folders.
  // (Signed upload URLs from bk-storage are rejected by the storage server on this project —
  // "InvalidSignature" — so that path is parked until Supabase resolves it.)
  return DB.storage.from("photos").upload(path, file, opts||{}) }

function bannersConfig(){
  // up to 3 independent banners, each with its own ad list, size,
  // gap, rotation timing/transition, and now horizontal position.
  // Falls back to building a single-banner array from the old flat
  // SITE.banner_* fields (from before multiple banners existed) when
  // banners_config is empty, so a site that already configured one
  // banner keeps showing it exactly as before, with nothing needing
  // to be re-entered — it just becomes banner #1, with #2 and #3
  // starting off disabled.
  var arr = null;
  try{
    var parsed = JSON.parse(SITE.banners_config||"[]");
    if(Array.isArray(parsed) && parsed.length) arr = parsed;
  }catch(e){}
  if(!arr){
    var legacyItems = bannerItemsLegacy();
    arr = [{
      enabled: !!SITE.banner_enabled, items: legacyItems,
      size: SITE.banner_size||"728x90", customW: SITE.banner_custom_w||728, customH: SITE.banner_custom_h||90,
      gap: SITE.banner_gap!=null?SITE.banner_gap:14, hPosition: 50,
      rotationSeconds: SITE.banner_rotation_seconds||5, transition: SITE.banner_transition||"fade",
      textEnabled: !!SITE.banner_text_enabled, textSize: SITE.banner_text_size||14, textColor: SITE.banner_text_color||"#ffffff",
      text_ar: SITE.banner_text_ar||"", text_en: SITE.banner_text_en||"", text_de: SITE.banner_text_de||"",
      link: SITE.banner_link_url||""
    }];
  }
  while(arr.length<3) arr.push({enabled:false, items:[], size:"728x90", customW:728, customH:90, gap:14, hPosition:50,
    rotationSeconds:5, transition:"fade", textEnabled:false, textSize:14, textColor:"#ffffff",
    text_ar:"", text_en:"", text_de:"", link:""});
  return arr;
}
function bannerItemsLegacy(){
  try{
    var arr = JSON.parse(SITE.banner_items||"[]");
    if(Array.isArray(arr) && arr.length) return arr.filter(function(it){ return it && it.url });
  }catch(e){}
  var legacyType = SITE.banner_media_type || "image";
  var legacyUrl = legacyType==="video" ? SITE.banner_video_url : SITE.banner_image_url;
  if(legacyUrl) return [{type:legacyType, url:legacyUrl}];
  return [];
}
// the admin's in-progress working copy of all 3 banners — kept
// separate from SITE so editing (adding/removing ads, adjusting any
// control) never touches the live site until "Save" is actually
// clicked, and so uploading several files one after another doesn't
// need a full page re-render between each one
var ADM_bannersDraft = null;

var ADM_bgPendingDeletes = []; // homepage-background URLs replaced by upload but not yet saved

function updateBannerItemsZone(bIdx){
  var zone = document.getElementById("bannerItemsZone"+bIdx);
  if(!zone) return;
  zone.innerHTML = bannerItemsAdminHtml(bIdx);
  wireBannerItemsZone(bIdx);
}
function wireBannerItemsZone(bIdx){
  var zone = document.getElementById("bannerItemsZone"+bIdx);
  if(!zone) return;
  zone.querySelectorAll("[data-bannerrm]").forEach(function(btn){
    btn.onclick=function(){
      var parts = this.dataset.bannerrm.split("-");
      var bi = parseInt(parts[0],10);
      var removedItems = ADM_bannersDraft[bi].items.splice(parseInt(parts[1],10),1);
      // the actual storage deletion waits for "Save" — removing this
      // item from the draft doesn't touch anything saved yet, and
      // deleting the file immediately here would leave a broken image
      // behind if the admin removed it but then navigated away
      // without ever actually saving
      if(removedItems[0]) (ADM_bannerPendingDeletes[bi]=ADM_bannerPendingDeletes[bi]||[]).push(removedItems[0].url);
      updateBannerItemsZone(bIdx);
    };
  });
  zone.querySelectorAll("[data-bannerlink]").forEach(function(input){
    input.oninput=function(){
      var parts = this.dataset.bannerlink.split("-");
      ADM_bannersDraft[parseInt(parts[0],10)].items[parseInt(parts[1],10)].link = this.value;
    };
  });
  var fileInput = zone.querySelector("#scBannerFile"+bIdx);
  if(fileInput) fileInput.onchange=async function(){
    var f=this.files&&this.files[0]; if(!f) return;
    var msgEl=zone.querySelector("#scBannerFileMsg"+bIdx);
    var isVideo=/^video\//.test(f.type);
    var isGif=f.type==="image/gif";
    try{
      if(!DB) throw new Error("no client");
      if(msgEl) msgEl.textContent=t("uploading");
      var path=(isVideo?"videos/banners/":"photos/banners/")+Date.now()+"_"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      var uploadFile=f, uploadContentType=f.type;
      // an animated GIF must upload completely untouched — shrink()
      // draws through a <canvas> and re-encodes as a single static
      // JPEG frame, which would silently strip the animation. Only a
      // genuinely static image (never GIF) goes through the normal
      // resize pipeline; video is already uploaded as-is everywhere
      // else in this app for the same reason.
      if(!isVideo && !isGif){
        var raw=await new Promise(function(res,rej){
          var r=new FileReader(); r.onload=function(){res(r.result)};
          r.onerror=function(){rej(new Error("read"))}; r.readAsDataURL(f);
        });
        uploadFile = await shrink(raw, 1600, 0.85);
        uploadContentType = "image/jpeg";
      }
      var up=await storageUpload(path, uploadFile,
        {contentType:uploadContentType, upsert:false});
      if(up.error) throw up.error;
      var url=DB.storage.from("photos").getPublicUrl(path).data.publicUrl;
      ADM_bannersDraft[bIdx].items.push({type: isVideo?"video":"image", url: url, link:""});
      updateBannerItemsZone(bIdx);
    }catch(e){ if(msgEl) msgEl.textContent=e.message||"error" }
  };
}

  // one banner's own markup — callers place this in whichever
  // context applies (see home()): either its own strip above the
  // hero, or dropped into the hero's own .wrap in place of the
  // headline when that's turned off.
  if(!cfg.enabled || !cfg.items.length) return "";
  var showText = cfg.textEnabled && (cfg["text_"+L]||"").trim();
  var textHtml = showText ? '<div class="topbanner-text"'+
    (cfg.textSize||cfg.textColor?' style="'+(cfg.textSize?'font-size:'+cfg.textSize+'px;':'')+(cfg.textColor?'color:'+cfg.textColor+';':'')+'"':'')+
    '>'+cfg["text_"+L]+'</div>' : '';
  var itemsHtml = cfg.items.map(function(it,i){
    var mediaHtml = it.type==="video"
      ? '<video src="'+it.url+'" autoplay muted loop playsinline></video>'
      : '<img src="'+it.url+'" alt="">';
    // each photo/video in the rotation can go to its own destination
    // now — falls back to the banner's older, single shared link for
    // any item that doesn't have its own set yet, so a banner
    // configured before this existed keeps working exactly as before
    var itLink = it.link || cfg.link || "";

  }).join("");
  var size = cfg.size==="custom" ? {w:cfg.customW||728,h:cfg.customH||90} : (BANNER_SIZES[cfg.size]||BANNER_SIZES["728x90"]);
  var hPos = cfg.hPosition!=null ? cfg.hPosition : 50;
  return '<div class="topbanner-col" style="--banner-w:'+size.w+'px;--banner-ratio:'+size.w+'/'+size.h+';--banner-gap:'+(cfg.gap!=null?cfg.gap:14)+'px;--banner-hpos:'+(hPos/100)+'">'+
    '<div class="topbanner" id="topBanner'+bIdx+'" data-rotate-seconds="'+(cfg.rotationSeconds||5)+'" data-transition="'+(cfg.transition||"fade")+'" data-count="'+cfg.items.length+'">'+
    '<div class="topbanner-media">'+itemsHtml+'</div>'+textHtml+'</div></div>';
}
function topBannerCoreRowHtml(){
  // all enabled, populated banners, each independently positioned
  // anywhere across the FULL width of the row (not confined to a
  // fixed one-third share) — this is what gives the horizontal
  // position control real, wide range, and lets banners sit right on
  // top of each other if that's genuinely what's wanted, rather than
  // being squeezed into equal columns that leave barely any room to
  // actually move within.
  var banners = bannersConfig();
  var html = banners.map(function(cfg,i){ return bannerCoreHtml(cfg,i) }).join("");
  if(!html) return "";
  // since every banner is now absolutely positioned, none of them
  // contribute to the row's own height on their own — so it's
  // computed here instead, tall enough for whichever enabled banner
  // would be tallest at its own configured size
  var maxH = banners.reduce(function(m,cfg){
    if(!cfg.enabled || !cfg.items.length) return m;
    var size = cfg.size==="custom" ? {w:cfg.customW||728,h:cfg.customH||90} : (BANNER_SIZES[cfg.size]||BANNER_SIZES["728x90"]);
    var gap = cfg.gap!=null ? cfg.gap : 14;
    return Math.max(m, size.h + gap);
  }, 0);
  return '<div class="topbanner-row" style="height:'+maxH+'px">'+html+'</div>';
}
function topBannerHtml(){
  // above-the-hero placement for however many of the 3 banners are

  var row = topBannerCoreRowHtml();

  return '<div class="topbanner-wrap"><div class="wrap">'+row+'</div></div>';

function home(){
 // Buy/rent is chosen once, in the hero tabs (F.deal); the type tiles follow it instead of

 var hd = F.deal || HOMEDEAL || "sale";

 var NOCOMM={ar:"بدون أي عمولة — من المالك مباشرة", en:"no commission, direct from owners", de:"ohne Provision, direkt vom Eigentümer"};

// Single source of truth for whether a listing matches the CURRENT
// filters in F. Used by search() for the actual results, by n() for
// the per-option facet counts in the sidebar, and by heroCount() for
// the home page preview — so all three can never show different
// numbers for what is really the same underlying filter state.
// skipField lets a facet count ask "how many would match if every
// OTHER active filter stayed as-is" (excluding the one field being
// previewed, so picking that option shows the right resulting count).
function passesFilter(x, skipField){
  // pending (not-yet-approved) listings must never appear in public
  // search/browse results — only the owner (and admins, via a fully
  // separate admin data path) should ever see them before approval.
  // "sold"/"rented" listings still show (with a stamp), same as before.
  if(x.status && x.status!=="live" && x.status!=="sold" && x.status!=="rented"){
    if(!(USER && x.uid && x.uid===USER.id)) return false;
  }
  if(skipField!=="g" && (F.govs&&F.govs.length ? F.govs.indexOf(x.g)===-1 : (F.g&&x.g!==F.g))) return false;
  if(skipField!=="a" && (F.areas&&F.areas.length ? F.areas.indexOf(x.a)===-1 : (F.a&&x.a!==F.a))) return false;
  if(skipField!=="tb" && F.deal!=="rent"){
    if(F.tbs&&F.tbs.length ? F.tbs.indexOf(x.tb)===-1 : (F.tb&&x.tb!==F.tb)) return false;
  }
  if(skipField!=="cd" && F.cd&&x.cd!==F.cd) return false;
  if(skipField!=="furn" && F.deal==="rent" && F.furn){
    if(F.furn==="yes" && !x.furn) return false;
    if(F.furn==="no" && x.furn) return false;
  }
  if(skipField!=="rentalPeriod" && F.deal==="rent" && F.rentalPeriod){
    if((x.rentalPeriod||"yearly")!==F.rentalPeriod) return false;
  }
  if(skipField!=="t"){
    if(F.types&&F.types.length){
      var typeMatch=F.types.some(function(ty){return ty==="land"?secOf(x.t)==="land":x.t===ty});
      if(!typeMatch) return false;
    } else if(F.t==="land"?secOf(x.t)!=="land":(F.t&&x.t!==F.t)) return false;
  }
  if(F.sec&&secOf(x.t)!==F.sec) return false;
  if(skipField!=="deal" && F.deal&&x.d!==F.deal) return false;
  if(skipField!=="price"){
    if(F.pmin&&x.p<F.pmin) return false;
    if(F.pmax&&x.p>F.pmax) return false;
  }
  if(F.ownerOnly && !x.ow) return false;
  return true;
}

// "12% below the area average · $455/m² · 7 listings" — only when the area has enough live
// sale listings for an average to mean anything
function priceContextHtml(x){
  var ap = x.aid && AREA_PRICES[x.aid];
  if(x.d==="rent" || !ap || +ap.listings < 3 || !x.m2 || !+ap.avg_price_per_m2) return '';
  var avg = +ap.avg_price_per_m2, mine = x.p/x.m2, diff = Math.round((mine-avg)/avg*100);
  var W = {ar:["أقل من متوسط المنطقة","أعلى من متوسط المنطقة","بسعر متوسط المنطقة","إعلان"],
           en:["below the area average","above the area average","at the area average","listings"],
           de:["unter dem Gebietsdurchschnitt","über dem Gebietsdurchschnitt","im Gebietsdurchschnitt","Anzeigen"]}[L] || {};
  var w = W.length ? W : ["below the area average","above the area average","at the area average","listings"];
  var main = Math.abs(diff) < 5 ? w[2] : '<span class="ltr">'+Math.abs(diff)+'%</span> '+(diff<0 ? w[0] : w[1]);
  return '<div class="pricecmp'+(diff<=-5?' good':diff>=5?' high':'')+'">'+main+
         ' · <span class="ltr">$'+Math.round(avg)+'</span>/'+t("sqm")+' · <span class="ltr">'+ap.listings+'</span> '+w[3]+'</div>';
}

function similarListingsSection(x){
  var sameCity = D.LIST.filter(function(l){
    return String(l.id)!==String(x.id) && l.status==="live" && l.g===x.g;
  }).slice(0,12);
  if(!sameCity.length) return '';
  return '<div class="wrap" style="padding:8px 18px 40px">'+
   '<h2 style="font-size:18px;font-weight:700;margin-bottom:14px">'+t("similarInH").replace("{city}",gN(x.g))+'</h2>'+
   '<div class="simcarousel" id="simCarousel">'+
    '<div class="simtrack" id="simTrack">'+sameCity.map(function(x,i){return card(x,i,false)}).join("")+'</div>'+
   '</div>'+
  '</div>';
}

  if(!ADM.storageUsage) return '<div class="adashempty">'+t("loading")+'</div>';
  var mb = ADM.storageUsage.bytes/1048576;
  var limitMb = SITE.storage_limit_mb||1024;
  var pct = Math.min(100, Math.round(mb/limitMb*100));
  var mbText = mb<1 ? (Math.round(mb*1024))+' KB' : (mb<1024 ? Math.round(mb*10)/10+' MB' : Math.round(mb/1024*100)/100+' GB');
  var limitText = limitMb<1024 ? limitMb+' MB' : Math.round(limitMb/1024*100)/100+' GB';
  var freeMb = Math.max(0, limitMb-mb);
  var freeText = freeMb<1024 ? Math.round(freeMb*10)/10+' MB' : Math.round(freeMb/1024*100)/100+' GB';
  return '<div class="abartrack" style="height:14px;margin-bottom:8px"><div class="abarfill" style="width:'+pct+'%;background:'+(pct>90?"var(--danger)":pct>70?"var(--gold)":"var(--ok)")+'"></div></div>'+

    '<span class="ltr">'+pct+'%</span></div>'+
   '<div style="margin-top:6px;font-size:12.5px;color:var(--grey)">'+t("storageFree")+': <b class="ltr" style="color:var(--ink)">'+freeText+'</b> \u00b7 '+

 var emailInbox=function(kind, items, filterKey, selKey, buildRow, buildDetail, emptyText, deleteRpc){
   var filter=ADM[filterKey]||"all";
   var shown=filter==="open"?items.filter(function(x){return !(x.resolved||x.handled)}):
             filter==="solved"?items.filter(function(x){return x.resolved||x.handled}):items;
   var selId=ADM[selKey];
   var selItem=selId?shown.filter(function(x){return String(x.id)===String(selId)})[0]:null;
   if(!selItem && shown.length) selItem=shown[0];
   return '<div class="inbox">'+
    '<div class="inbox-list">'+
     '<div class="msgfilters">'+
      ["all","open","solved"].map(function(fk){return '<button class="mfbtn'+(filter===fk?" on":"")+'" data-emailfilter="'+kind+':'+fk+'">'+t("mf_"+fk)+'</button>'}).join("")+
     '</div>'+
     '<input id="aq'+kind+'" placeholder="'+t("searchPH")+'" class="asearch" style="margin:10px 0">'+
     '<div class="inbox-rows" id="inboxRows'+kind+'">'+
      (shown.length ? shown.map(function(x){ return buildRow(x, selItem&&String(selItem.id)===String(x.id)) }).join("")
       : '<div class="done2"><b>'+emptyText+'</b></div>')+
     '</div>'+
    '</div>'+
    '<div class="inbox-detail" id="inboxDetail'+kind+'">'+
     (selItem ? '<button class="ab inbox-back" data-emailback="'+kind+'">\u2039 '+t("backToList")+'</button>'+
       buildDetail(selItem)+
       '<button class="ab bad" style="margin-top:12px" data-emaildelete="'+kind+':'+selItem.id+'">'+t("deleteItem")+'</button>'
      : '<div class="done2"><b>'+t("selectAnItem")+'</b></div>')+
    '</div>'+
   '</div>'};

  // one media library covering every category the site stores files
  // for. "Listings" keeps the existing gallery (every listing photo,
  // click to open that listing) unchanged; the other three show
  // whatever's actually sitting in that category's own storage
  // folder — photos and videos together — with delete access, since
  // those aren't tied to a database row the way listing photos are.
  var mediaCat = ADM.mediaCategory||"listings";
  var catTabs = [["listings",t("listingsTab")],["ads",t("adsTab")],["banners",t("topBannerH")],["background",t("heroBgH")]];
  body = '<div class="pick" style="margin-bottom:14px">'+catTabs.map(function(c){
      return '<label><input type="radio" name="mediaCat" value="'+c[0]+'"'+(mediaCat===c[0]?" checked":"")+'><span>'+c[1]+'</span></label>'
    }).join("")+'</div>';
  ADM.mediaSearch = ADM.mediaSearch||{};
  var msKey = mediaCat, ms = ADM.mediaSearch[msKey] = ADM.mediaSearch[msKey]||{q:"",used:"",sort:"newest"};
  // one shared filter bar + grid renderer for all four categories, so
  // "search by number, used status, and upload date" behaves exactly
  // the same everywhere instead of four separately-built versions
  // that could each drift out of sync with each other over time
  ADM.mediaSelected = ADM.mediaSelected||{};
  var selSet = ADM.mediaSelected[msKey] = ADM.mediaSelected[msKey]||{};
  var renderMediaSection = function(items, opts){
    var q = (ms.q||"").trim().toLowerCase();
    var filtered = items.filter(function(it){
      if(q && (it.label||"").toLowerCase().indexOf(q)===-1) return false;
      if(ms.used==="used" && !it.isUsed) return false;
      if(ms.used==="unused" && it.isUsed) return false;
      if(ms.type==="photo" && it.isVideo) return false;
      if(ms.type==="video" && !it.isVideo) return false;
      return true;
    });
    filtered.sort(function(a,b){
      var da=new Date(a.uploadedAt||0), db=new Date(b.uploadedAt||0);
      return ms.sort==="oldest" ? da-db : db-da;
    });
    var dateFmt = function(d){ if(!d) return ""; var dt=new Date(d); return isNaN(dt) ? "" : dt.toISOString().slice(0,10) };
    // only a genuinely deletable (not-in-use) item is ever selectable
    // in the first place — an "in use" item never gets a checkbox at
    // all, so "select all" physically cannot catch one, filtered view
    // or not
    var selectable = filtered.filter(function(it){ return it.deletePath && !it.isUsed });

function wireNotifBell(){
  // wires just the bell button and notification items — used both by
  // the normal wire() pass and by the lightweight periodic refresh
  // below, which swaps out only #notifWrap without touching anything
  // else on the page (so it never disrupts a form the user is filling
  // in, an open dropdown elsewhere, scroll position, etc.)
  if(!$("#bellBtn")) return;
  $("#bellBtn").onclick=function(e){
    e.stopPropagation();
    var m=$("#menu"); if(m) m.classList.remove("on");
    NOTIF_OPEN=!NOTIF_OPEN;
    $("#notifMenu").classList.toggle("on",NOTIF_OPEN);
    if(NOTIF_OPEN && NOTIFS.unread){
      NOTIFS.items.forEach(function(n){n.is_read=true}); NOTIFS.unread=0;
      $$(".notifitem.unread").forEach(function(el){el.classList.remove("unread")});
      var badge=$(".bellbadge"); if(badge) badge.remove();
      rpc("bk_mark_notifications_read",{p_user:USER.id}).catch(function(){});
    }
  };
  $$("[data-notiflink]").forEach(function(e){ e.onclick=function(){
    var link=this.dataset.notiflink;
    if(link&&link.indexOf("#/msgs")>-1){ LOADED.msgs=false; MYMSGS={reports:[],feedback:[]}; VIEW="msgs"; scrollTo(0,0); render() }
    else if(link&&link.indexOf("#/listing/")>-1){ VIEW="listing:"+link.split("/listing/")[1]; scrollTo(0,0); render() }
  }});
}
var _notifPollTimer=null;
function startNotifPolling(){
  if(_notifPollTimer) return;
  if(DB && USER) rpc("bk_heartbeat",{p_user:USER.id}).catch(function(){});
  _notifPollTimer=setInterval(function(){
    if(!USER) return;
    if(DB) rpc("bk_heartbeat",{p_user:USER.id}).catch(function(){});
    var before=JSON.stringify(NOTIFS);
    loadNotifications().then(function(){
      if(JSON.stringify(NOTIFS)===before) return; // nothing changed, skip any DOM work
      var wrap=$("#notifWrap");
      if(!wrap) return; // header not in its logged-in state right now
      // if the user has the panel open, keep it open and re-mark as
      // read locally so a genuinely new item doesn't get lost
      var wasOpen=NOTIF_OPEN;
      if(wasOpen){ NOTIFS.items.forEach(function(n){n.is_read=true}); NOTIFS.unread=0; }
      wrap.outerHTML=notifBellHTML();
      wireNotifBell();
    });
  }, 20000);
}
function notifText(n){

  if(n.title==="reply_feedback") return {title:t("notif_replyFeedback"), body:n.body||""};

  if(n.title==="price_change")   return {title:t("notif_priceChange"),  body:n.body||""};
  return {title:n.title, body:n.body||""};
}

function searchLabel(f){
  var bits=[];
  if(f.govs&&f.govs.length) bits.push(f.govs.map(gN).join(", "));
  else if(f.g) bits.push(gN(f.g));
  if(f.areas&&f.areas.length) bits.push(f.areas.map(aN).join(", "));
  else if(f.a) bits.push(aN(f.a));
  if(f.tbs&&f.tbs.length) bits.push(f.tbs.map(function(k){return D.TABU[k]?D.TABU[k][li()]:k}).join(", "));
  else if(f.tb&&D.TABU[f.tb]) bits.push(D.TABU[f.tb][li()]);
  if(f.types&&f.types.length) bits.push(f.types.map(function(k){return k==="land"?t("landGroup"):(D.TYPES[k]?D.TYPES[k][li()]:k)}).join(", "));
  else if(f.t&&D.TYPES[f.t]) bits.push(D.TYPES[f.t][li()]);
  bits.push(f.deal==="rent"?t("forrent"):t("forsale"));
  return bits.join(" \u00b7 ")}

function videoEmbedInfo(url){
  if(!url) return null;
  var yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{6,})/);
  if(yt) return {platform:"youtube", embedUrl:"https://www.youtube.com/embed/"+yt[1]+
    "?rel=0&modestbranding=1&fs=0&playsinline=1&autoplay=1&mute=1&loop=1&playlist="+yt[1]};
  // Facebook's video plugin supports a direct iframe embed for a
  // public video URL — no SDK/script needed, works the same way as
  // the YouTube embed above
  if(/facebook\.com\/.+\/videos\//.test(url) || /fb\.watch\//.test(url)){
    return {platform:"facebook", embedUrl:"https://www.facebook.com/plugins/video.php?href="+encodeURIComponent(url)+"&show_text=false&autoplay=false"};
  }
  return null;
}
// kept for compatibility with any code path that only needs the URL
function youtubeEmbedUrl(url){ var v=videoEmbedInfo(url); return v?v.embedUrl:null; }
function hexToRgb(hex){
  var h=(hex||"").replace("#","");
  if(h.length===3) h=h.split("").map(function(c){return c+c}).join("");
  var n=parseInt(h,16);
  if(isNaN(n)||h.length!==6) return "9,14,26";
  return [(n>>16)&255,(n>>8)&255,n&255].join(",");
}
function adSlotsRow(){
  if(!AD_SLOTS.length) return "";
  var showIcons = SITE.ad_use_icons!==false;
  var showTag = SITE.ad_tag_enabled!==false;
  var tagSize = SITE.ad_tag_size||9;
  var tagText = (SITE["ad_tag_"+L]&&SITE["ad_tag_"+L].trim()) ? SITE["ad_tag_"+L] : t("adTag");
  var sqSize = SITE.ad_square_size||130;
  var roomInfoSize = SITE.ad_roominfo_size||9;
  var showLoc = SITE.ad_location_enabled!==false;
  var locSize = SITE.ad_location_size||9;
  var textColor = SITE.ad_text_color||"#ffffff";
  var shadeRgb = hexToRgb(SITE.ad_shade_color||"#090e1a");
  // no more slicing to the first 16 — every active ad is rendered
  // into the track, and the carousel scrolls/rotates through however
  // many there actually are, showing only a handful at a time
  var slotsHtml = AD_SLOTS.map(function(a,ai){
   var chipName = a.sponsor_name || a.label || "";
   var chip = chipName ? '<span class="adchip">'+esc(chipName)+'</span>' : '';
   var featCls = ai===0 ? ' adslot-feat' : '';
   var featText = ai===0 && (a.label||a.sponsor_name) ? '<div class="adfeat-t"><span class="adfeat-tag">'+GX("featured")+'</span><b>'+esc(a.label||a.sponsor_name)+'</b>'+(a.label&&a.sponsor_name?'<span>'+esc(a.sponsor_name)+'</span>':'')+'</div>' : '';
   var isLinked = a.linked_listing_id && a.l_photos && a.l_photos.length;
   var isVideoEmbed = !isLinked && a.video_embed_url;
   var isUploadedVideo = a.media_type==="video" && a.image_url;
   var manualImgs = (!isLinked && !isVideoEmbed && !isUploadedVideo && a.image_urls && a.image_urls.length) ? a.image_urls : null;
   var external = !isLinked && !isVideoEmbed && a.link_url;
   var media;
   var overlayTop = a.overlay_top ? '<div class="adslot-overtext adslot-overtop" style="font-size:'+roomInfoSize+'px;color:'+textColor+';background:linear-gradient(to bottom,rgba('+shadeRgb+',.85) 0%,transparent 100%)">'+a.overlay_top+'</div>' : '';
   var overlayBottom = a.overlay_bottom ? '<div class="adslot-overtext adslot-overbottom" style="font-size:'+roomInfoSize+'px;color:'+textColor+';background:linear-gradient(to top,rgba('+shadeRgb+',.85) 0%,transparent 100%)">'+a.overlay_bottom+'</div>' : '';
   if(isLinked){
     var place=[a.l_area_name?aN(a.l_area_name):"", a.l_gov?gN(a.l_gov):""].filter(Boolean).join(", ");
     media = '<img class="adslot-rotimg" src="'+a.l_photos[0]+'" data-photos="'+
       encodeURIComponent(JSON.stringify(a.l_photos))+'" data-idx="0" alt="" loading="lazy">'+
       '<div class="adslot-foot" style="font-size:'+roomInfoSize+'px;color:'+textColor+';'+
         'background:linear-gradient(to top,rgba('+shadeRgb+',.85) 0%,rgba('+shadeRgb+',.55) 55%,transparent 100%)">'+
        (a.l_rooms?'<span>'+(showIcons?ICON_BED:"")+a.l_rooms+(showIcons?"":" "+t("rooms"))+'</span>':'')+
        (a.l_baths?'<span>'+(showIcons?ICON_BATH:"")+a.l_baths+(showIcons?"":" "+t("baths"))+'</span>':'')+
        (a.l_area?'<span class="ltr">'+(showIcons?ICON_AREA:"")+a.l_area+(showIcons?"":" "+t("sqm"))+'</span>':'')+
       '</div>'+
       (place&&showLoc?'<div class="adslot-place" style="font-size:'+locSize+'px;color:'+textColor+';background:rgba('+shadeRgb+',.6)">'+place+'</div>':'');
   } else if(isVideoEmbed){
     var vInfo = videoEmbedInfo(a.video_embed_url);
     media = vInfo ? '<iframe class="adslot-embed" src="'+vInfo.embedUrl+'" '+
       'frameborder="0" allow="autoplay; encrypted-media" allowfullscreen="0"></iframe>' :
       '<div class="adslot-empty">'+(a.label||t("adPlaceholder"))+'</div>';
   } else if(isUploadedVideo){
     media = overlayTop+overlayBottom+'<video src="'+a.image_url+'" autoplay muted loop playsinline data-hoverplay></video>';
   } else if(manualImgs){
     media = overlayTop+overlayBottom+'<img class="adslot-rotimg" src="'+manualImgs[0]+'" data-photos="'+
       encodeURIComponent(JSON.stringify(manualImgs))+'" data-idx="0" alt="'+((a.label||"").replace(/"/g,"&quot;"))+'" loading="lazy">';
   } else if(a.image_url){
     media = overlayTop+overlayBottom+'<img src="'+a.image_url+'" alt="'+((a.label||"").replace(/"/g,"&quot;"))+'" loading="lazy">';
   } else {
     media = '<div class="adslot-empty">'+(a.label||t("adPlaceholder"))+'</div>';
   }
   if(isVideoEmbed){
     // the video itself isn't wrapped in a clickable link, so clicks
     // reach the player — but an optional small corner badge can
     // still take visitors somewhere else if a destination was set
     return '<div class="adslot'+featCls+'">'+media+chip+featText+
       (a.link_url ? '<a class="adslot-visit" href="'+a.link_url+'" target="_blank" rel="noopener sponsored" style="color:'+textColor+';background:rgba('+shadeRgb+',.75)">'+t("adVisitLink")+'</a>' : '')+
       (showTag?'<span class="adtag" style="font-size:'+tagSize+'px;color:'+textColor+';background:rgba('+shadeRgb+',.75)">'+tagText+'</span>':'')+'</div>';
   }
   return '<a class="adslot'+featCls+'" '+
     (isLinked ? 'data-open="'+a.linked_listing_id+'"' : 'href="'+(a.link_url||"#")+'"'+(external?' target="_blank" rel="noopener sponsored"':' onclick="return false"'))+'>'+
     media+chip+featText+(showTag?'<span class="adtag" style="font-size:'+tagSize+'px;color:'+textColor+';background:rgba('+shadeRgb+',.75)">'+tagText+'</span>':'')+'</a>'}).join("");
  // the carousel only actually needs to rotate/scroll if there are
  // more ads than comfortably fit — but the arrows and track markup
  // stay the same shape either way, they just have nothing to do
  // when everything already fits in view
  var carouselSeconds = SITE.ad_carousel_seconds!=null ? SITE.ad_carousel_seconds : 3;
  var carouselDir = SITE.ad_carousel_direction || "left";
  // the track holds THREE back-to-back copies of every ad — clone,
  // real, clone — starting the visible position at the beginning of
  // the middle (real) copy. Moving forward or back ever runs out of
  // actual content to slide into (which is what looked like squares
  // "going empty" on one side) — every direction always has more of
  // the same content ready to slide in, and once the animation
  // carries the view into one of the cloned copies, the code quietly
  // snaps back to the identical spot in the middle copy right after,
  // with no visible jump since every copy is pixel-identical. That's
  // what makes it feel like a continuous wheel instead of a strip
  // with two hard edges, however few or many ads there actually are.
  var tripledHtml = slotsHtml + slotsHtml + slotsHtml;

function startBannerRotation(){

  // possible banner slots — same lightweight pattern as the small
  // square ads' own rotation, and just as harmless to leave running
  // when none of them are even on screen (nothing found, does
  // nothing for that slot) as when some of them briefly are.
  if(_bannerRotateTimer) return;

  }, 1000);

function tickBannerRotation(elId){
  var el = document.getElementById(elId);
  if(!el) return;
  var count = parseInt(el.dataset.count,10)||1;
  if(count<2) return;
  // guards against a rotation interval short enough to overlap the
  // transition's own ~650ms — without this, a second rotation could
  // start mid-transition and leave more than one item marked "on"
  // at once (confirmed directly: this was a real bug, not just a
  // theoretical one, until this flag was added)
  if(el.dataset.transitioning==="1") return;
  var now = Date.now();
  var seconds = parseInt(el.dataset.rotateSeconds,10)||5;
  if(!el.dataset.nextRotateAt){ el.dataset.nextRotateAt = now + seconds*1000; return }
  if(now < +el.dataset.nextRotateAt) return;
  el.dataset.nextRotateAt = now + seconds*1000;
  var items = [].slice.call(el.querySelectorAll(".topbanner-item"));
  var curIdx = items.findIndex(function(it){ return it.classList.contains("on") });
  if(curIdx===-1) curIdx = 0;
  var nextIdx = (curIdx+1) % items.length;
  var transition = el.dataset.transition || "fade";
  var cur = items[curIdx], next = items[nextIdx];
  // clears every possible leaving-*/entering-* class first, on BOTH
  // elements about to be used — an item that already cycled through
  // once still carries its previous leaving-<transition> class
  // (its final, held keyframe state), and leaving that in place
  // while adding a fresh entering-<transition> for its next turn
  // would run two conflicting animations on the same properties at
  // once, confirmed directly while testing this
  var allTransitionClasses = ["fade","slide-left","slide-right","slide-up","slide-down"]
    .reduce(function(acc,tr){ return acc.concat(["leaving-"+tr,"entering-"+tr]) }, []);
  allTransitionClasses.forEach(function(c){ cur.classList.remove(c); next.classList.remove(c) });
  el.dataset.transitioning = "1";
  cur.classList.add("leaving-"+transition);
  next.classList.add("on","entering-"+transition);
  setTimeout(function(){
    cur.classList.remove("on","leaving-"+transition);
    next.classList.remove("entering-"+transition);
    el.dataset.transitioning = "0";
  }, 650);
}

function initAdCarouselPosition(){
  var gl=document.getElementById("adCarousel"); if(gl && gl.classList.contains("glide")) return;
  // every render rebuilds the whole page from scratch, so the
  // carousel element is always brand-new with no dataset.currentIdx
  // of its own yet — without this, the track would visually sit at
  // the very start of the first cloned copy (untransformed) while
  // moveAdCarousel() assumes it starts at the middle, REAL copy,
  // causing a visible jump the first time it's used after any render
  var el = document.getElementById("adCarousel");
  var track = document.getElementById("adCarouselTrack");
  if(!el || !track) return;
  var count = parseInt(el.dataset.count,10)||0;
  if(count<2) return;
  var items = [].slice.call(track.querySelectorAll(".adslot"));
  if(!items.length) return;
  var itemW = items[0].getBoundingClientRect().width;
  var step = itemW + 10;
  el.dataset.currentIdx = count;
  var rtl = document.documentElement.dir==="rtl";
  track.style.transition = "none";
  track.style.transform = "translateX("+(count * step * (rtl?1:-1))+"px)";
  void track.offsetWidth;
  track.style.transition = "";
}
function moveAdCarousel(dir){
  // dir: +1 moves forward (next ad revealed), -1 moves back. Shared
  // by both the auto-rotation timer and the manual arrow buttons, so
  // clicking an arrow is exactly the same step the carousel would
  // have taken on its own — just user-triggered instead of timed.
  var el = document.getElementById("adCarousel");
  var track = document.getElementById("adCarouselTrack");
  if(!el || !track) return;
  var count = parseInt(el.dataset.count,10)||0;
  if(count<2) return; // one (or zero) ads — nothing to rotate through
  var items = [].slice.call(track.querySelectorAll(".adslot"));
  if(!items.length) return;
  var itemW = items[0].getBoundingClientRect().width;
  var gap = 10;
  var step = itemW + gap;
  var curIdx = parseInt(el.dataset.currentIdx,10);
  // starts at the beginning of the middle (real) copy of three —
  // see adSlotsRow() for why there are three copies in the track
  if(isNaN(curIdx)) curIdx = count;

  // copy's own start or end), silently jump back to the equivalent
  // position in the middle copy right after the slide animation

  // jump is invisible, and it's what makes the rotation feel
  // endless in either direction instead of hitting a hard edge
  if(curIdx < count || curIdx >= count*2){

      var stillEl = document.getElementById("adCarousel");

function startAdCarouselRotation(){

    var el = document.getElementById("adCarousel");
    if(!el || el.classList.contains("glide")) return;
    var count = parseInt(el.dataset.count,10)||0;
    if(count<2) return; // nothing to rotate through
    var now = Date.now();
    var seconds = parseFloat(el.dataset.seconds);
    if(isNaN(seconds)) seconds = 3;
    if(!el.dataset.nextRotateAt){ el.dataset.nextRotateAt = now + seconds*1000; return }
    if(now < +el.dataset.nextRotateAt) return;

function startAdRotation(){
  if(_adRotateTimer) return;
  // a single shared setInterval ticking all images at once is exactly
  // why they were flipping in sync — instead, each image gets its own
  // randomized rotation schedule, checked on a more frequent shared
  // "clock" tick, so they drift naturally out of sync with each other
  _adRotateTimer=setInterval(function(){
    var now=Date.now();
    $$(".adslot-rotimg").forEach(function(img){
      try{
        var photos=JSON.parse(decodeURIComponent(img.dataset.photos||"[]"));
        if(photos.length<2) return;
        if(!img.dataset.nextRotateAt){
          // first time we've seen this element (fresh render) — give it
          // a random starting offset instead of rotating immediately
          img.dataset.nextRotateAt = now + Math.floor(Math.random()*3000) + 1500;
          return;
        }
        if(now < +img.dataset.nextRotateAt) return;
        var idx=(parseInt(img.dataset.idx,10)+1)%photos.length;
        img.style.opacity="0";
        setTimeout(function(){
          img.dataset.idx=idx; img.src=photos[idx];
          img.style.opacity="1";
        }, 350);
        // small random jitter on the period itself too, so two images
        // that happen to sync up once don't stay locked together
        img.dataset.nextRotateAt = now + 2700 + Math.floor(Math.random()*800);
      }catch(e){}
    });
  }, 500);
}

var _postMapInstance = null, _viewMapInstance = null;
// Shared picker-map logic for both the post form and the edit form.
// `state` is the object holding .lat/.lng (NEW for posting, EDIT for
// editing); `containerId`/`wrapId`/`clearBtnId` are that form's own
// element ids; `govSelectId` is used to center the map on whichever
// governorate the lister has already chosen, so they don't have to
// hunt for their city on a map of the whole country.
var _geocodeCache = {};
function geocodeAreaAndRecenter(map, areaName, govName, hadNoPinYet){
  if(!map || !areaName || !govName || !hadNoPinYet) return;
  var key = areaName+"|"+govName;
  if(_geocodeCache[key]){
    map.setView(_geocodeCache[key], 13);
    return;
  }
  var q = encodeURIComponent(areaName+", "+govName+", Syria");
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+q)
    .then(function(r){ return r.json() })
    .then(function(results){
      if(results && results[0]){
        var pt = [parseFloat(results[0].lat), parseFloat(results[0].lon)];
        _geocodeCache[key] = pt;
        map.setView(pt, 13);
      }
    }).catch(function(){});
}
function initPickerMap(containerId, state, govSelectIdOrCoords, wrapId, clearBtnId, onChange, areaSelectId){
  var container = document.getElementById(containerId);
  var LMap = window.LeafletLib;
  if(!container) return null;
  if(typeof LMap === "undefined"){
    // first map of the session: fetch Leaflet, then run this same init again
    ensureLeaflet().then(function(){
      if(!document.getElementById(containerId)) return;
      _postMapInstance = initPickerMap(containerId, state, govSelectIdOrCoords, wrapId, clearBtnId, onChange, areaSelectId);
    }).catch(function(){});
    return null;
  }
  var govCenter = null;
  if(Array.isArray(govSelectIdOrCoords)){
    govCenter = govSelectIdOrCoords;
  } else {
    var govEl = document.getElementById(govSelectIdOrCoords);
    govCenter = govEl && GOV_COORDS[govEl.value] ? GOV_COORDS[govEl.value] : null;
  }
  var startLat = state.lat || (govCenter ? govCenter[0] : 34.8);
  var startLng = state.lng || (govCenter ? govCenter[1] : 38.5);
  var zoom = state.lat ? 15 : (govCenter ? 11 : 7);
  var map = LMap.map(container).setView([startLat,startLng], zoom);
  LMap.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19, attribution:"\u00a9 OpenStreetMap"}).addTo(map);
  var marker = state.lat ? LMap.marker([state.lat,state.lng]).addTo(map) : null;
  // once a specific area is chosen, zoom in further than the generic
  // governorate center — but only if the lister hasn't already placed
  // their own pin, so we never override a deliberate choice
  if(areaSelectId && !state.lat){
    var areaEl = document.getElementById(areaSelectId);
    var govElForName = !Array.isArray(govSelectIdOrCoords) ? document.getElementById(govSelectIdOrCoords) : null;
    if(areaEl && areaEl.value && govElForName && govElForName.value){
      geocodeAreaAndRecenter(map, areaEl.value, govElForName.value, true);
    }
  }
  map.on("click",function(e){
    state.lat=e.latlng.lat; state.lng=e.latlng.lng;
    if(onChange) onChange();
    if(marker) marker.setLatLng(e.latlng); else marker=LMap.marker(e.latlng).addTo(map);
    var clr=document.getElementById(clearBtnId);
    if(!clr){ var wrap=document.getElementById(wrapId);
      if(wrap) wrap.insertAdjacentHTML("beforeend",'<button type="button" class="ab bad" id="'+clearBtnId+'" style="margin-top:8px">'+t("removeLocationBtn")+'</button>');
    }
  });
  setTimeout(function(){ map.invalidateSize() }, 120);
  return map;
}

   search-results flow, and not on the homepage), reached only from
   the header's "More" menu. This is a deliberate rebuild after an
   earlier attempt was fully removed for causing a blank map, stuck
   screens, unresponsive buttons, and broken navigation. The root
   cause was architectural: this app fully replaces the page's HTML
   on every render, which conflicts badly with a stateful library
   like Leaflet if the map is embedded somewhere that re-renders

   on its own dedicated, rarely-re-rendered view — and being strict

  if(!container) return;
  if(typeof LMap === "undefined"){
    ensureLeaflet().then(function(){ if(document.getElementById("mapSearchBox")) initMapSearch() }).catch(function(){});
    return;
  }
  if(_mapSearchInstance){ try{ _mapSearchInstance.remove() }catch(e){} _mapSearchInstance=null; }
  // fresh, at execution time — never captured earlier and carried
  // through a closure, which is exactly what caused stale/empty data
  // to win a race against a later render in the previous attempt
  var withLoc = mapSearchMatches().filter(function(x){ return x.lat && x.lng });
  var center = withLoc.length ? [withLoc[0].lat, withLoc[0].lng] : [34.8, 38.5];
  var map = LMap.map(container).setView(center, withLoc.length ? 11 : 7);
  LMap.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19, attribution:"\u00a9 OpenStreetMap"}).addTo(map);
  var bounds = [];
  // hovering a pin used to open a native Leaflet popup, which by
  // default auto-pans the MAP itself whenever the popup would
  // otherwise be clipped near an edge — exactly the "map jumps around
  // on hover" behavior reported. Professional map-search UIs (Zillow,
  // Redfin, Bayut) never move the map for a hover preview; the card
  // itself repositions instead. So this is a plain, custom-positioned
  // div — not Leaflet's popup system at all — placed above the pin by
  // default and flipped below it, or nudged sideways, only when there
  // genuinely isn't room, measured against the map's own container,
  // never the map's coordinate system (which is what panning would
  // otherwise disturb).
  var mapWrap = container;
  if(getComputedStyle(mapWrap).position==="static") mapWrap.style.position="relative";
  var previewEl = document.createElement("div");
  previewEl.className = "mappin-popup-custom";
  previewEl.style.display = "none";
  mapWrap.appendChild(previewEl);
  var activePinId = null;
  function positionPreview(point){
    var pw = previewEl.offsetWidth, ph = previewEl.offsetHeight;
    var cw = mapWrap.clientWidth, ch = mapWrap.clientHeight;
    var gap = 14;
    var top = point.y - ph - gap; // default: above the pin
    var flippedBelow = false;
    if(top < 4){ top = point.y + gap; flippedBelow = true } // not enough room above — flip below instead
    var left = point.x - pw/2; // default: centered on the pin
    if(left < 4) left = 4;
    if(left + pw > cw - 4) left = cw - 4 - pw;
    previewEl.style.top = top + "px";
    previewEl.style.left = left + "px";
    previewEl.classList.toggle("flip-below", flippedBelow);
  }
  var closeTimer = null;
  function cancelPopupClose(){ if(closeTimer){ clearTimeout(closeTimer); closeTimer=null; } }
  function schedulePopupClose(){ cancelPopupClose(); closeTimer=setTimeout(function(){ previewEl.style.display="none"; activePinId=null }, 200); }
  function goToMapListing(id){
    if(_mapSearchInstance){ try{ _mapSearchInstance.remove() }catch(e){} _mapSearchInstance=null; }
    VIEW="listing:"+id; scrollTo(0,0); render();
    refreshListingsOnNavigate();
  }
  previewEl.addEventListener("mouseenter", cancelPopupClose);
  previewEl.addEventListener("mouseleave", schedulePopupClose);
  // the pin itself is a tiny click target — clicking anywhere on the
  // detail card that opens from it should navigate too, matching how
  // a normal listing card is clickable anywhere on its surface
  previewEl.addEventListener("click", function(){
    var host = previewEl.querySelector("[data-pin-listing]");
    if(host) goToMapListing(host.getAttribute("data-pin-listing"));
  });
  // panning/zooming moves every pin's screen position — the preview
  // would otherwise sit frozen, visibly detached from its pin
  map.on("movestart zoomstart", function(){ previewEl.style.display="none"; activePinId=null });
  withLoc.forEach(function(x){
    var cover = (x.photos&&x.photos[0]) || x.cover || null;
    var priceText = x.d==="rent" ? (money(x.p)+" "+t("monthlyRent")) : money(x.p);
    var popupHtml = '<div class="mappin-preview" data-pin-listing="'+x.id+'" style="cursor:pointer">'+
      (cover ? '<img src="'+cover+'" alt="">' : '<div class="mappin-nophoto">'+t("photos")+'</div>')+
      '<div class="mappin-body"><b class="mappin-price">'+priceText+'</b>'+
      '<div class="mappin-loc">'+ICON_PIN+aN(x.a)+(L==="ar"?'\u060c ':', ')+gN(x.g)+'</div>'+
      '<div class="mappin-meta">'+
       (x.r?'<span>'+ICON_BED+x.r+'</span><span>'+ICON_BATH+x.b+'</span>':'')+
       (x.living?'<span>'+ICON_SOFA+x.living+'</span>':'')+
      '</div>'+
      '<div class="mappin-type">'+D.TYPES[x.t][li()]+(x.d!=="rent"&&x.tb&&D.TABU[x.tb]?' \u00b7 '+(x.tb==="green"?'<span class="tabu-green">'+D.TABU[x.tb][li()]+'</span>':D.TABU[x.tb][li()]):'')+'</div></div></div>';
    var marker = LMap.marker([x.lat,x.lng]).addTo(map);
    marker.on("mouseover", function(){
      cancelPopupClose();
      activePinId = x.id;
      previewEl.innerHTML = popupHtml;
      previewEl.style.display = "block";
      positionPreview(map.latLngToContainerPoint([x.lat,x.lng]));
    });
    marker.on("mouseout", function(){ schedulePopupClose() });
    marker.on("click", function(){ goToMapListing(x.id) });
    bounds.push([x.lat,x.lng]);
  });
  if(bounds.length>1){ try{ map.fitBounds(bounds, {padding:[30,30]}) }catch(e){} }
  _mapSearchInstance = map;
  setTimeout(function(){ if(_mapSearchInstance===map) map.invalidateSize() }, 120);
}

function positionDropUpOrDown(input,drop){
  try{
    if(!input.getBoundingClientRect) return;
    var rect=input.getBoundingClientRect();
    var vh=window.innerHeight||document.documentElement.clientHeight||800;
    var spaceBelow=vh-rect.bottom, needed=304;
    if(spaceBelow<needed && rect.top>needed){ drop.classList.add("flip-up") }
    else { drop.classList.remove("flip-up") }
  }catch(e){}
}
function markGreenTabu(root){
  var labels=(D.TABU&&D.TABU.green)||[]; if(!labels.length) return;
  var walker=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT,null), nodes=[], n;
  while((n=walker.nextNode())){ var tx=n.nodeValue.trim(); if(!tx||labels.indexOf(tx)===-1) continue; var p=n.parentNode; if(!p||/^(SCRIPT|STYLE|TEXTAREA|OPTION|TITLE)$/.test(p.tagName)||p.classList.contains("tabu-green")) continue; nodes.push(n) }
  nodes.forEach(function(tn){ var sp=document.createElement("span"); sp.className="tabu-green"; sp.textContent=tn.nodeValue; tn.parentNode.replaceChild(sp,tn) });
}
